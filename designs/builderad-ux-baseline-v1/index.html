function home(){const d=data();return `${header('ما الذي يستحق اهتمامك الآن؟','ملخص قصير من نشاطك، ثم انتقال مباشر إلى الوظيفة المناسبة.',btn(`${icon('edit')} تعديل الهدف`,'editGoal'))}<div class="compact-row" style="margin-bottom:13px"><div class="muted small">الاتجاه الاختياري: <strong style="color:var(--ink)">${escapeHTML(business().goal||'دون هدف محدد')}</strong></div>${modeControl()}</div>${hasSample()?`<div class="grid grid-2 home-special"><section class="case-main"><div class="compact-row">${badge('مثال لمسألة تستحق الفحص','amber')}${badge('بيانات تدريبية','blue')}</div><h2>${escapeHTML(d.headline)}</h2><p>${escapeHTML(d.reason)}</p><div class="case-actions">${btn(`${icon('search')} افهم المشكلة`,'caseEvidence','primary')}${btn('أضف مراجعة إلى قراراتي','caseDecision')}</div></section>${panel('إشارات أخرى تستحق النظر','ترتيب توضيحي، وليس تشخيصًا حقيقيًا',`<div class="case-list"><button data-action="marketOpportunity"><span class="round-icon blue">${icon('compass')}</span><span class="case-desc"><strong>فرصة في العرض أو الوصول</strong><span>${escapeHTML(d.opps[0][0])}</span></span>${icon('chevron','sm')}</button><button data-action="budgetExplain"><span class="round-icon warn">${icon('megaphone')}</span><span class="case-desc"><strong>راجع توزيع الإنفاق</strong><span>مقارنة السيناريوهات قبل أي تغيير</span></span>${icon('chevron','sm')}</button><button data-action="sourceExplain"><span class="round-icon">${icon('shield')}</span><span class="case-desc"><strong>تحقق من صحة النتائج</strong><span>توافق الإشارات مع نتيجة النشاط</span></span>${icon('chevron','sm')}</button></div>`)}</div><div style="height:14px"></div>${stats()}`:empty('لا توجد بيانات نتائج متصلة','يمكنك بدء فهم النشاط والسوق، وإعداد عرض وخطة أولية دون حساب إعلاني. ولن نعرض نتائج مالية دون مصدر مؤهل.','goMarket','استكشف وظائف السوق')}${`<h2 class="section-heading">من الفرصة إلى نتيجة يمكن التحقق منها <small>خريطة الوظائف، وليست خطوات ملزمة للزيارة</small></h2><div class="journey">${[['market','السوق والعملاء','أين الفرصة؟'],['plan','العروض والخطة','ماذا أقدم؟'],['ads','الإعلانات','كيف أخطط؟'],['sales','المبيعات والتحويل','ما عائق البيع؟'],['results','النتائج والعائد','ما الذي تحقق؟'],['decisions','القرارات والتحسين','ما الخطوة التالية؟']].map((x,i)=>`<button data-nav="${x[0]}"><div class="jstep">${String(i+1).padStart(2,'0')}</div><strong>${x[1]}</strong><small>${x[2]}</small></button>`).join('')}</div>`}<h2 class="section-heading">متابعة العمل <small>تجد القرارات في موضعها، ويُحتفظ بسجل مركزي لها</small></h2><div class="grid grid-2">${panel('قرارات تحتاج مراجعة',`${state.decisions.length} قرار محفوظ داخل التجربة`,state.decisions.slice(0,3).map(z=>`<div class="overview-row">${icon('checks')}<div><h3>${escapeHTML(z.title)}</h3><p>${escapeHTML(z.source)} · ${decisionStatus(z.status)}</p></div>${btn('افتح','goDecisions','small rightlink')}</div>`).join('')||empty('لا توجد قرارات بعد','أضف قرارًا من أي قسم.'))}${panel('كيف تتعامل BuilderAd مع الأدلة؟','قواعد ثابتة نختبر بها تصور الواجهة',`<div class="row-list"><div class="row-item">${icon('check')}<div class="grow"><strong>تصريحات النشاط</strong><p>مدخل يساعد على التخصيص؛ ليس نتيجة متحققة</p></div>${badge('معلن')}</div><div class="row-item">${icon('search')}<div class="grow"><strong>دليل من مصدر</strong><p>يتطلب نطاقًا ووقتًا وحق استخدام وصلاحية</p></div>${badge('يتطلب تأهيلًا')}</div><div class="row-item">${icon('checks')}<div class="grow"><strong>قرار أو تنفيذ</strong><p>التوصية لا تعني تنفيذ إجراء أو إثبات أثره</p></div>${badge('منفصل')}</div></div>`)}</div>`;}
function market(){const d=data();const t=state.tabs.market;let content='';if(t==='customers'){content=`<div class="grid grid-2">${panel('من يمكن أن يستفيد من عرضك؟','فرضية وصفية وليست قاعدة عملاء مكتشفة',`<div class="feature">${icon('users')}<div><h3>شريحة مناسبة للمراجعة</h3><p>${escapeHTML(d.customer)}</p>${badge('فرضية سوقية','amber')}</div></div><div class="stepnote" style="margin-top:12px">لا يمكن التعرف إلى أشخاص بعينهم، ولا إنشاء قائمة تواصل دون مصدر وحقوق مناسبة.</div>`)}${panel('أين عملائي؟','أسئلة البحث التي يمكن للمنصة خدمتها',`<div class="row-list">${[['من يحتاج هذا العرض؟','احتياج العميل وموقف الشراء'],['في أي منطقة؟','الملاءمة الجغرافية وليست كثافة السكان وحدها'],['متى يشتري؟','التوقيت والسياق دون ادعاء نية مؤكدة'],['كيف أختبر الفرضية؟','اختبار وصول صغير بمعيار واضح']].map(x=>`<div class="row-item">${icon('target','sm')}<div class="grow"><strong>${x[0]}</strong><p>${x[1]}</p></div></div>`).join('')}</div>${btn('انتقل إلى خطة الوصول','goPlan','tonal small')}`)}</div>`;}if(t==='competitors'){content=`<div class="grid grid-2">${panel('تفوق على المنافسين','مساحة عمل متخصصة وليست جدول أسعار فقط',`<div class="feature">${icon('target')}<div><h3>المنافسة من وجهة نظر المشتري</h3><p>${escapeHTML(d.competitor)}</p>${badge('إطار مقارنة مقترح','amber')}</div></div><div class="row-list" style="margin-top:12px">${[['البدائل','ماذا يستطيع العميل اختياره بدلًا منك؟'],['الفروق المهمة','السعر، القيمة، الخدمة، التوافر، الثقة'],['فرصة التميز','تحسين قابل للإثبات بدل ادعاء التفوق'],['الرصد المستمر','أي تغير يستحق تعديل عرضك؟']].map(x=>`<div class="row-item"><div class="grow"><strong>${x[0]}</strong><p>${x[1]}</p></div></div>`).join('')}</div>`) }${panel('قالب مقارنة تفاعلي','املأ مقارنة أولية في المتصفح. لا تُجمع بيانات منافسين تلقائيًا.',`<form id="competitorForm" class="formgrid"><div class="field"><label>اسم المنافس أو البديل</label><input name="competitor" required maxlength="70" placeholder="مثال: متجر بديل" /></div><div class="field"><label>عامل المقارنة</label><selec function plan(){const t=state.tabs.plan;let c='';if(t==='offers'){c=`<div class="grid grid-2">${panel('عرضك التجاري','معلومة يصرّح بها النشاط ويمكن تعديلها',`<form id="offerForm" class="formgrid"><div class="field full"><label>ما الذي تقدمه؟</label><input name="offer" required maxlength="110" value="${escapeHTML(business().offer)}"/></div><div class="field full"><label>لمن؟ وبأي قيمة؟</label><textarea name="message" maxlength="500">${escapeHTML(state.draftMessage)}</textarea></div><div class="field full"><button class="btn primary" type="submit">حفظ العرض محليًا</button></div></form>`) }${panel('فحص العرض قبل الإعلان','التشخيص لا يبدأ بمقاييس المنصة',`<div class="row-list">${[['القيمة','هل الفارق مع البدائل واضح ومثبت؟'],['الملاءمة','هل يلبي احتياج شريحة معروفة؟'],['الوفاء','هل تتوافر قدرة التنفيذ أو المخزون؟'],['اقتصاديات العرض','هل تسمح التكلفة والهامش بالاكتساب؟']].map(x=>`<div class="row-item">${icon('check','sm')}<div class="grow"><strong>${x[0]}</strong><p>${x[1]}</p></div></div>`).join('')}</div><div class="stepnote">لا نفترض توفر المنتجات أو هامش الربح دون بيانات نشاط مؤهلة.</div>`)}</div>`;}if(t==='message'){c=`<div class="grid grid-2">${panel('القيمة والرسالة','تكوين مسودة محلية؛ ليست محتوى مولدًا بنموذج ذكاء اصطناعي',`<form id="messageForm"><label>الرسالة الرئيسية</label><textarea name="message" required maxlength="500">${escapeHTML(state.draftMessage)}</textarea><div class="compact-row" style="margin-top:10px"><button type="submit" class="btn primary">حفظ المسودة</button>${btn('نسخ المسودة','copyMessage')}</div></form>`)}${panel('ما الذي يجعل الرسالة مقنعة؟','بدل عبارات دعائية عامة',`<div class="row-list">${[['احتياج محدد','ما الذي يريد المشتري حله؟'],['ميزة حقيقية','لماذا يكون هذا العرض مناسبًا؟'],['دليل قابل للتحقق','ما الذي يمكن إثباته؟'],['دعوة واضحة','ما الخطوة المناسبة دون وعود غير مضمونة؟']].map(x=>`<div class="row-item">${icon('bulb','sm')}<div class="grow"><strong>${x[0]}</strong><p>${x[1]}</p></div></div>`).join('')}</div>`)}</div>`;}if(t==='goals'){c=`${panel('الغاية والأولويات','الاتجاه المعلن قابل للتعديل، ولا يساوي نتيجة مؤكدة',`<form id="goalForm" class="formgrid"><div class="field full"><label>ما الذي تريد تحقيقه؟</label><input name="goal" maxlength="180" value="${escapeHTML(business().goal)}" /></div><div class="field full"><p class="muted small">الغاية اختيارية. اتركها فارغة لإزالتها؛ تغييرها لا يعيد كتابة إفادات المصدر أو التاريخ.</p></div><div class="field full"><button class="btn primary" type="submit">تحديث الغاية</button></div></form><div class="stepnote" style="margin-top:13px">تعديل الغاية في هذا النموذج لا يعيد كتابة الأرقام التاريخية أو يتحقق من تحقيقها.</div>`)}`;}if(t==='channels'){c=`<div class="grid grid-2">${panel('قنوات الوصول المقترحة','تجربة تخطيط محلية، وليست توصية من بيانات سوق حقيقية',`<form id="channelsForm"><div class="checks">${[['search','البحث والخرائط'],['social','الإعلانات الاجتماعية'],['organic','المحتوى العضوي'],['direct','الشراكات والتواصل المباشر']].map(([id,label])=>`<label class="checkpill"><input type="checkbox" name="channel" value="${id}" ${state.channels.includes(id)?'checked':''} />${label}</label>`).join('')}</div><div style="height:13px"></div><label>حد إنفاق شهري تجريبي (${escapeHTML(data().currency)})</label><input id="budgetSlider" type="range" min="500" max="50000" step="500" value="${state.budget}" style="accent-color:var(--brand);min-height:25px" aria-label="ميزانية تجريبية"/><div class="compact-row"><span class="readout" id="budgetValue">${fmt(state.budget)}</span><span class="small muted">لا يُرسل الإنفاق إلى أي منصة</span></div><div style="height:15px"></div><button class="btn primary" type="submit">حفظ خطة وصول</button></form>`) }${panel('كيف تُختار القناة؟','القناة وسيلة وليست هدفًا',`<div class="row-list">${[['الملاءمة','هل تستقبل القناة المشتري في موقف مناسب؟'],['القدرة','هل تستطيع تجهيز المحتوى وتنفيذ المتابعة؟'],['الاقتصاديات','هل يمكن اختبار التكلفة مقابل نتيجة فعلية؟'],['الاختبار','ما شرط الإبقاء أو التوقف أو التوسع؟']].map(x=>`<div class="row-item">${icon('target','sm')}<div class="grow"><strong>${x[0]}</strong><p>${x[1]}</p></div></div>`).join('')}</div><div class="stepnote">توجد قنوات غير مدفوعة؛ لا تجعل جميع خطط الوصول مرهونة بحساب إعلاني.</div>`)}</div>`;}

function ads(){const t=state.tabs.ads,d=data();let c='';if(t==='campaigns'){c=hasSample()?`${panel('الحملات في السيناريو','الأسماء والإنفاق والحالات أمثلة تدريبية وليست حسابات متصلة',`<div class="tablewrap"><table class="table"><thead><tr><th>الحملة</th><th>المنصة</th><th>إنفاق تجريبي</th><th>الحالة</th><th>إجراء</th></tr></thead><tbody>${d.campaigns.map((c,i)=>`<tr><td><strong>${escapeHTML(c[0])}</strong></td><td>${escapeHTML(c[1])}</td><td>${money(c[2])}</td><td>${badge(c[3],i===0?'green':'')}</td><td>${btn('تحليل','campaign'+i,'small')}</td></tr>`).join('')}</tbody></table></div>`)}<div style="height:13px"></div>${panel('لا تتخذ قرارًا من رقم واحد','قراءة متخصصة للمنصة والمصدر والنتيجة',`<div class="grid grid-3">${[['التسليم','هل يتأثر بالمزاد أو الجدولة أو العرض؟'],['التعلّم والإشارات','هل تملك المنصة أحداث تحسين مؤهلة؟'],['القيمة التجارية','هل تغير الإنفاق مفيد في ظل هامش وسعة النشاط؟']].map(x=>`<div class="feature"><div><h3>${x[0]}</h3><p>${x[1]}</p></div></div>`).join('')}</div>`)}`:empty('لا توجد حملات في الوضع الحالي','تستطيع العمل على الفرص والعروض والخطة دون ربط حساب إعلاني. الربط الحقيقي غير متاح داخل HTML.','goSources','تعرّف على المصادر');}
if(t==='creative'){c=`<div class="grid grid-2">${panel('الإعلانات والمحتوى','المسودة تبدأ من القيمة التجارية وليس عدد الصور',`<div class="feature">${icon('bulb')}<div><h3>زاوية إعلان قابلة للاختبار</h3><p>${escapeHTML(state.draftMessage)}</p>${badge('مسودة نشاط','blue')}</div></div><div style="margin-top:12px">${btn('تحرير الرسالة','goMessage','tonal')}</div>`)}${panel('كيف نقيّم الإبداع؟','لا نفترض معرفة أداء داخلي غير مرصود',`<div class="row-list">${[['قوة العرض','ما الوعد الذي يمكن إثباته؟'],['توافق الرسالة','هل تتطابق مع صفحة الوصول أو التواصل؟'],['التحسين التجريبي','غيّر عنصرًا محددًا وراقب النتيجة'],['آلية المنصة','ما مؤشرات التسليم والتعلم المتاحة فعلًا؟']].map(x=>`<div class="row-item">${icon('check','sm')}<div class="grow"><strong>${x[0]}</strong><p>${x[1]}</p></div></div>`).join('')}</div>`)}</div>`;}if(t==='targeting'){c=`<div class="grid grid-2">${panel('الجماهير والاستهداف','تطبيق قابلية الوصول داخل المنصة الإعلانية يختلف عن تحليل السوق',`<div class="feature">${icon('users')}<div><h3>فرضية العميل المناسب</h3><p>${escapeHTML(d.customer)}</p>${badge('تحتاج اختبارًا','amber')}</div></div><div class="stepnote" style="margin-top:12px">الإعدادات الإعلانية وصلاحيات الاستهداف تختلف حسب المنصة والبلد والمنتج.</div>`)}${panel('قرارات الاستهداف','يُراعى خصوصية كل شبكة',`<div class="row-list">${[['خيارات الاستهداف','المتاح فعليًا داخل مزود محدد'],['الاستبعاد','تجنب التكرار غير المرغوب وفق بيانات وصلاحيات ملائمة'],['إعادة الاستهداف','تتطلب موافقة وبيانات واستخدامًا مشروعًا'],['قياس الجودة','التوافق بين وصول الإعلانات والنتائج التجارية']].map(x=>`<div class="row-item">${icon('target','sm')}<div class="grow"><strong>${x[0]}</strong><p>${x[1]}</p></div></div>`).join('')}</div>`)}</div>`;}
if(t==='budget'){c=`<div class="grid grid-2">${panel('تجربة توزيع ميزانية','محاكاة يدوية فقط؛ لا تحديث لأي حملة',`<form id="budgetForm"><label>الميزانية المفترضة</label><input type="number" min="0" max="100000000" step="100" name="budget" required value="${state.budget}" /><div class="fieldhint">حفظ التغيير ينشئ مقترح مراجعة، ولا يغير إنفاقًا فعليًا.</div><div style="height:12px"></div><button class="btn primary" type="submit">سجّل مقترح ميزانية</button></form>`)}${panel('قبل تغيير الإنفاق','معايير قرار لا يُفترض توفرها تلقائيًا',`<div class="row-list">${[['النتيجة المؤهلة','هل لدينا تعريف وقياس مناسب للمخرجات؟'],['التكلفة والربحية','هل يسمح هامش المساهمة بالزيادة؟'],['القيود التشغيلية','هل يمكن الوفاء بالطلب الإضافي؟'],['أثر التغيير','كيف نتحقق من التحسن بعد التنفيذ؟']].map(x=>`<div class="row-item">${icon('check','sm')}<div class="grow"><strong>${x[0]}</strong><p>${x[1]}</p></div></div>`).join('')}</div>`)}</div>`;}if(t==='safety'){c=`<div class="grid grid-2">${panel('جودة الزيارات والحماية','فرق واضح بين الاشتباه والخسارة المؤكدة',`<div class="row-list">${[['نشاط آلي أو مشبوه','إشارة تحتاج تمييز الطلبات البشرية والآلية'],['نقرات غير صالحة','يجب استبعاد ما صُفّي أو رُدّ فعليًا'],['تحويلات غير موثوقة','قد تشوّه قياس الحملات وجودة التحسين'],['حظر خاطئ','إجراء الحماية قد يمنع عميلاً حقيقيًا']].map(x=>`<div class="row-item">${icon('shield','sm')}<div class="grow"><strong>${x[0]}</strong><p>${x[1]}</p></div>${badge('يتطلب دليلًا')}</div>`).join('')}</div>${btn('افتح طريقة الفحص','fraudEvidence','tonal small')}`)}${panel('ما الذي لا نحسبه هدرًا؟','لا توجد حاسبة خسائر بنسب ثابتة',`<div class="callout warning">${icon('alert')}<div>لا يمكن اعتبار زيارة مشبوهة مالًا ضائعًا قبل إثبات ارتباطها بإنفاق قابل للفوترة، واستبعاد الحالات التي عالجتها المنصة أصلًا.</div></div><div class="stepnote" style="margin-top:12px">الهدف التجاري: حماية بيانات القرار والإنفاق دون ادعاء استرداد أموال افتراضية.</div>`)}</div>`;}

function sales(){const t=state.tabs.sales,d=data();let c='';if(t==='inquiries'){c=panel('التفاعل والتحويل','تصور تتبع تجاري مخطط؛ لا صندوق استفسارات أفراد في هذا المرجع',`<div class="grid grid-3">${[['تفاعل','سؤال أو طلب قد يعبّر عن حاجة؛ لا يثبت هوية عميل فريد.'],['فرصة تجارية','تحتاج تعريف ملاءمة وحق استعمال مستقلًا.'],['نتيجة','تحتاج واقعة بيع أو حجز أو خدمة مناسبة، لا مجرد تسجيل.']].map(x=>`<div class="feature"><div><h3>${x[0]}</h3><p>${x[1]}</p></div></div>`).join('')}</div><div class="stepnote" style="margin-top:14px">أعداد الاستفسارات وقنواتها وفترتها قد تكون ذات قيمة. إدارة إفاداتها الحالية موجودة تحت الإعدادات ← البيانات والإفادات. حفظ الإفادة ليس تتبعًا لأشخاص أو تحققًا من المبيعات.</div><div style="margin-top:13px">${btn('عرض إفادات الاستفسارات','goAssertions','tonal')}</div>`)}else if(t==='orders'){c=hasSample()?panel('أمثلة طلبات أو حجوزات','صفوف تركيبية منفصلة؛ لا سجلات تشغيلية أو تحقق مستقل',`<div class="row-list">${d.salesRows.map(x=>`<div class="row-item">${icon('receipt')}<div class="grow"><strong>${escapeHTML(x[1])}</strong><p>${escapeHTML(x[2])} · مثال فقط</p></div>${badge('توضيحي','blue')}</div>`).join('')}</div>`):empty('لا بيانات طلبات متاحة','يمكنك استكشاف السوق والخطة وإدارة الإفادات المستقلة دون مصدر خارجي.','goAssertions','عرض إفادات الاستفسارات')}else if(t==='opportunities'){c=panel('الفرص والصفقات','تعريفات مخططة، لا خط مبيعات يعمل الآن',`<div class="row-list">${[['حاجة مناسبة','دليل ملاءمة للعرض والتوقيت والقدرة.'],['عرض أو تفاوض','واقعة مستقلة لا تنشأ من عدد استفسارات.'],['تعاقد أو إغلاق','يتطلب مصدرًا وتعريفًا وحق استعمال ملائمًا.']].map(x=>`<div class="row-item"><div class="grow"><strong>${x[0]}</strong><p>${x[1]}</p></div>${badge('مخطط')}</div>`).join('')}</div>`)}else if(t==='customers'){c=panel('علاقات العملاء','قدرة مخططة؛ لا هوية أشخاص أو قاعدة عملاء داخل التصميم',`<p class="muted">العميل الجديد والعائد وقيمة العلاقة تحتاج معاملات مؤهلة وتعريفًا للهوية وحقوقًا مناسبة. لا تُستنتج من إفادة مجمّعة أو نموذج اتصال.</p>`)}else{c=panel('المتابعة التجارية','قدرة مخططة، لا تواصل آلي أو إدارة أفراد',`<p class="muted">يمكن تدوين سؤال مراجعة ضمن القرارات والتحسين. ذلك لا يرسل رسالة أو يغيّر حالة عميل.</p>${btn('فتح القرارات والتحسين','goDecisions','tonal')}`)}return `${header('المبيعات والتحويل','ما الذي يحدث بعد التفاعل، وما الدليل الذي يحوّله إلى نتيجة؟',btn('عرض إفادات الاستفسارات','goAssertions','tonal'))}${tabsView('sales')}${c}`;}
function chart(){return '<p class="muted small">لا توجد سلسلة زمنية مؤهلة في هذا المرجع. الفترة المعروضة مثال ثابت دون توليد أرقام لفترات أخرى.</p>'}
function results(){const t=state.tabs.results,m=periodMetrics();let c='';const periodControl=`<div class="fixed-period">${fixedPeriod}<div style="margin-top:5px"><button type="button" class="btn small" disabled title="لا توجد لقطة مستقلة لهذه الفترة">٧ أيام غير متاحة</button> <button type="button" class="btn small" disabled title="لا توجد لقطة مستقلة لهذه الفترة">٩٠ يومًا غير متاحة</button></div></div>`;if(t==='signals'){c=panel('سلامة القياس والإشارات','أسئلة فحص، وليست نتائج تشخيص متصل',`<div class="row-list">${[['تعريف الحدث','ما الذي عُدّ؟ تسجيل أم طلب أم تحصيل؟'],['المجموعات والتغطية','هل الفترة والتعريف وعدم التداخل معروفون؟'],['المصدر والحق','هل القراءة الحالية والغرض والمعالجة مسموحة؟'],['التأخر والتصحيح','هل وصلت نتائج متأخرة أو تغيرت الإفادة؟']].map(x=>`<div class="row-item">${icon('info')}<div class="grow"><strong>${x[0]}</strong><p>${x[1]}</p></div></div>`).join('')}</div>`)}else if(!hasSample()){c=empty('لا أرقام مصدر خارجي متاحة','غياب البيانات ليس صفرًا ولا يمنع سياق النشاط أو الاستكشاف أو الإفادات المستقلة.','goAssertions','عرض إفادات الاستفسارات')}else if(t==='outcomes'){c=`${stats()}<div style="height:12px"></div><div class="grid grid-2">${panel('مراحل توضيحية منفصلة','لا فوج موحّد أو نسب انتقال مثبتة',`<div class="row-list">${data().funnel.map(([name,n])=>`<div class="row-item"><div class="grow"><strong>${escapeHTML(name)}</strong><p>عدد تركيبي؛ التعريف والتغطية وعدم التداخل غير مثبتة.</p></div><strong>${fmt(n)}</strong></div>`).join('')}</div>`)}${panel('كيف يُقرأ المثال؟','لا تشخيص تعثر أو أثر سببي من فرق العدادات وحده',`<p class="muted">اختر تعريف النتيجة المناسب للسؤال والنشاط. لا يوجد تسلسل إجباري من الربح أو المبيعات، ولا تحويل للاستفسارات إلى أشخاص فريدين. افتح أصل الإفادة قبل الاستنتاج.</p>${btn('عرض إفادات الاستفسارات','goAssertions','tonal')}`)}</div>`}else if(t==='attribution'){c=panel('الإسناد والنتيجة','مفاهيم مستقلة تحتاج أدلتها',`<div class="row-list"><div class="row-item"><div class="grow"><strong>إسناد منصة في المثال</strong><p>قيمة تركيبية ضمن تعريف الناشر، لا مساوية لبيع محصل.</p></div><strong>${fmt(m.reported)}</strong></div><div class="row-item"><div class="grow"><strong>نتيجة السيناريو</strong><p>عدد تركيبي مستقل؛ لا يُطرح من رقم الناشر لاستنتاج تكرار أو هدر.</p></div><strong>${fmt(m.completions)}</strong></div></div><div class="evidence">نموذج النسبة والنافذة الزمنية ودليل الربط والأثر السببي غير مثبتة في هذا الملف.</div>`)}else{c=panel('الاقتصاديات والعائد','أرقام افتراضية لا تثبت الربح أو تكلفة العميل',`<div class="row-list"><div class="row-item"><div class="grow"><strong>إنفاق السيناريو</strong><p>قيمة توضيحية من اللقطة الثابتة.</p></div><strong>${money(m.spend)}</strong></div><div class="row-item"><div class="grow"><strong>إيراد المثال</strong><p>ليس تحصيلًا متحققًا أو أثرًا منسوبًا للإعلان.</p></div><strong>${money(m.revenue)}</strong></div><div class="row-item"><div class="grow"><strong>الربح والأثر الإضافي</strong><p>لا تكاليف مؤهلة أو تجربة سببية كافية.</p></div>${badge('غير معروف','amber')}</div></div>`)}return `${header('النتائج والعائد','تعريف ومصدر وفترة وحدود لكل قراءة، بحسب غاية النشاط عندما تكون ذات صلة.',periodControl)}${tabsView('results')}${c}<div class="stepnote" style="margin-top:14px">أعداد الاستفسارات وقنواتها قد تساعد في سؤال مؤهل، لكنها لا تمنح تحليلًا أو تصديرًا تلقائيًا. ${btn('عرض إفادات الاستفسارات','goAssertions','small tonal')}</div>`;}

function decisionStatus(s){return ({reviewing:'قيد المراجعة',completed:'مراجعة محلية مكتملة',deferred:'مؤجلة'})[s]||'قيد المراجعة';}
function decisionBadge(s){return badge(decisionStatus(s),s==='completed'?'green':s==='deferred'?'':'amber');}
function decisionRow(z){return `<div class="row-item">${icon('checks')}<div class="grow"><strong>${escapeHTML(z.title)}</strong><p>${escapeHTML(z.source)} · ${escapeHTML(z.note||'')}</p></div>${decisionBadge(z.status)}<button class="btn small" data-action="decision:${z.id}">فتح</button></div>`;}
function decisions(){const t=state.tabs.decisions;let c='';if(t==='improvements'){c=panel('أسئلة تحسين تستحق المراجعة','الاقتراح ليس موافقة أو إجراءً خارجيًا',`<div class="row-list">${[[data().headline,'caseDecision'],['مراجعة ملاءمة العرض والخطة','planDecision'],['مراجعة تعريف الإشارات','signalDecision']].map(([x,a])=>`<div class="row-item">${icon('bulb')}<div class="grow"><strong>${escapeHTML(x)}</strong><p>مثال يحتاج دليلًا مناسبًا قبل الحكم.</p></div>${btn('حفظ للمراجعة',a,'small')}</div>`).join('')}</div>`)}else if(t==='records'){c=panel('سجل المراجعة المحلية','قيد المراجعة، مكتملة محليًا أو مؤجلة؛ بلا موافقة تنفيذ',`<div class="compact-row">${btn('سؤال مراجعة جديد','newDecision','primary small')}</div><div class="row-list">${state.decisions.map(decisionRow).join('')||'<p class="muted small">لا مراجعات محفوظة.</p>'}</div>`)}else if(t==='experiments'){c=panel('التجارب','تدوين فرضية ومعيار؛ لا تشغيل تجربة حيّة',`<p class="muted">تتطلب التجربة سؤالًا وعينة وفترة ومقارنة وحقوقًا مناسبة. تدوينها لا يجمع بيانات ولا يثبت أثرًا.</p>${btn('تدوين تجربة للمراجعة','experimentDecision','tonal')}`)}else{c=panel('متابعة الأثر','التنفيذ والأثر يظلان غير معروفين في هذا المرجع',`<p class="muted">اكتمال المراجعة المحلية لا يثبت موافقة صاحب سلطة أو تنفيذًا أو نتيجة تجارية. سجل التفاعل أدناه يصف العمل داخل الملف فقط.</p><div class="timeline">${state.audit.slice(0,6).map(x=>`<div class="timeentry"><strong>${escapeHTML(x.text)}</strong><p>${escapeHTML(x.time)}</p></div>`).join('')}</div>`)}return `${header('القرارات والتحسين','راجع السؤال والدليل، واحفظ الخطوة دون خلط حالة العمل بسلطة التنفيذ.',btn('سؤال مراجعة جديد','newDecision','primary'))}${tabsView('decisions')}${c}`;}

function sources(){let providers=[['Meta Ads','meta','مصدر إعلانات'],['Google Ads','google','مصدر إعلانات'],['TikTok Ads','tik','مصدر إعلانات'],['Snapchat Ads','snap','مصدر إعلانات'],['X Ads','x','مصدر إعلانات']];return `${header('المصادر والتكاملات','الربط، الاستيراد، حالة المصدر، وحقوق الاستعمال. لا توجد اتصالات فعلية داخل النموذج.',btn(`${icon('info')} ما الذي يدعمه الكود؟`,'codeScope','tonal'))}<div class="grid grid-3">${providers.map(([name,id,type])=>`<div class="sourcecard"><div class="sourcebadge">${name.split(' ')[0].slice(0,1)}</div><div style="flex:1"><strong>${name}</strong><p>${type} · لا يوجد ربط حقيقي في ملف HTML</p>${badge('غير متصل','amber')}<div style="height:10px"></div><button type="button" class="btn small" data-action="connectHelp:${id}">${icon('link','sm')} متطلبات الربط</button></div></div>`).join('')}</div><h2 class="section-heading">حالة الأدلة <small>التصريح أو المثال التدريبي ليس نتيجة موثقة من مصدر خارجي</small></h2><div class="grid grid-2">${panel('استيراد وإدخال يدوي','حدود الدلالة قبل الإفادة',`<div class="row-list">${[['تصريحات النشاط','تعديلات النشاط والغاية'],['الاستفسارات','إفادات مجمّعة خاصة بالنشاط؛ إدارتها ضمن البيانات والإفادات'],['النتائج التجارية','إفادة يدوية تحتاج إثباتًا مستقلًا']].map(x=>`<div class="row-item">${icon('receipt','sm')}<div class="grow"><strong>${x[0]}</strong><p>${x[1]}</p></div></div>`).join('')}</div>${btn('أدخل إفادة نتيجة','goSignals','tonal small')}`)}${panel('حقوق المصدر والصلاحيات','نطاقات حقيقية موجودة في المستودع ولكن لا تعمل داخل هذا الملف',`<div class="callout">${icon('lock')}<div>إن الاتصال بمزود لا يمنح تلقائيًا حق قراءة كل بيانات النشاط أو إجراء تغييرات إعلانية. الصلاحيات والتكاملات الحقيقية تبقى في التطبيق الخلفي.</div></div><div class="row-list" style="margin-top:12px"><div class="row-item">${icon('shield')}<div class="grow"><strong>هوية ونطاق استخدام</strong><p>مراجعة الأذونات عند كل أثر محمي</p></div></div><div class="row-item">${icon('clock')}<div class="grow"><strong>حالة حديثة للمصدر</ function settingsBusiness(){return `<div class="grid grid-2">${panel('معلومات النشاط','السياق الذي تستند إليه الأقسام المختلفة',`<form id="businessForm" class="formgrid"><div class="field"><label>اسم النشاط</label><input name="name" required maxlength="65" value="${escapeHTML(business().name)}"></div><div class="field"><label>القطاع</label><select name="sector"><option value="commerce" ${state.sector==='commerce'?'selected':''}>تجارة إلكترونية</option><option value="realestate" ${state.sector==='realestate'?'selected':''}>عقارات</option><option value="service" ${state.sector==='service'?'selected':''}>خدمات</option></select></div><div class="field full"><label>المنتج أو الخدمة</label><input name="offer" required maxlength="110" value="${escapeHTML(business().offer)}"></div><div class="field full"><label>السوق</label><input name="market" required maxlength="100" value="${escapeHTML(business().market)}"></div><div class="field full"><label>الغاية التجارية (اختيارية؛ اتركها فارغة لإزالتها)</label><input name="goal" maxlength="180" value="${escapeHTML(business().goal)}"></div><div class="field full"><button class="btn primary" type="submit">حفظ معلومات النشاط</button></div></form>`)}${panel('الفريق والصلاحيات','تصور حد الاستخدام وليس لوحة منح تشغيلية',`<div class="row-list">${[['مدير النشاط','صلاحية تتطلب تأهيلًا فعليًا خارج النموذج'],['المسوّق','تجهيز توصيات بحسب النطاق المسموح'],['المراجع','قراءة أدلة محددة دون تنفيذ إجراءات'],['مصدر البيانات','أصل مستقل وتاريخ وصلاحية']].map(x=>`<div class="row-item">${icon('lock','sm')}<div class="grow"><strong>${x[0]}</strong><p>${x[1]}</p></div>${badge('تصميم')}</div>`).join('')}</div><div class="stepnote" style="margin-top:12px">لا يمكن لهذا النموذج المصادقة أو منح وصول أو إدارة أسرار حسابات.</div>`)}</div><h2 class="section-heading">تفضيلات تجربة النموذج</h2><div class="grid grid-2">${panel('عرض البيانات','اختبر تجربة ببيانات تدريبية أو دون مصادر',`<div class="toggle-line"><div><strong>إظهار أمثلة مؤشرات ونتائج</strong><div class="muted small">لا يتغير أي مصدر حقيقي</div></div><button class="switch" type="button" role="switch" aria-label="إظهار البيانات التدريبية" aria-checked="${hasSample()}" data-action="toggleMode"></button></div>`)}${panel('ملفات وتجربة المستخدم','فقط بيانات هذا المتصفح التجريبية',`${btn(`${icon('download')} تصدير ملخص النموذج`,'export','tonal')}${btn(`${icon('refresh')} محو البيانات التدريبية`,'reset','danger')}`, '')}</div>`;}

const aggregateFixture={count:100,channel:'نموذج',period:'١–٧ أكتوبر ٢٠٢٦',issuer:'النشاط، في سيناريو تدريبي',definition:'عدد تسجيلات ضمن مجموعة النموذج المحددة للفترة؛ لا أشخاصًا فريدين.',accepted:null,cost:null,acquisition:null};
function settings(){return `${header('النشاط والفريق والإعدادات','سياق النشاط والحقوق وإدارة البيانات والإفادات في موضع أساسي واحد.')}${tabsView('settings')}${state.tabs.settings==='data'?assertionsPreview():settingsBusiness()}`}
function assertionsPreview(){const custom=activeBusinessId.startsWith('local-');return `${panel('إفادات الاستفسارات','حفظ وقراءة وتصحيح إفادات مجمّعة خاصة بالنشاط، وليست إدارة أفراد',custom?`<p class="muted">لا إفادة مجمّعة في هذا النشاط المحلي الجديد. غيابها ليس صفرًا، ولا يتطلب حساب إعلان أو CRM أو غاية معلنة. هذه نسخة عرض تصميم؛ لا تنشئ أوامر BF03 حقيقية.</p>`:`<div class="tablewrap"><table class="table"><thead><tr><th>المجموعة والفترة</th><th>قناة التسجيل</th><th>العدد المعلن</th><th>المقبولة</th><th>مصدر الاكتساب</th><th>التفاصيل</th></tr></thead><tbody><tr><td><strong>مجموعة نموذج تجريبية</strong><p class="muted small">${aggregateFixture.period}</p></td><td>${aggregateFixture.channel}</td><td>${fmt(aggregateFixture.count)}</td><td>غير معروف</td><td>غير معروف</td><td>${btn('الأصل والتعريف والتاريخ','assertionDetail','small')}</td></tr></tbody></table></div><div class="evidence" style="margin-top:13px">أرقام أدخلها النشاط؛ غير متحققة مستقلًا. هذه مجموعة واحدة محددة، لا إجمالي عملاء أو مصدر إحالة إعلاني.</div>`)}<div class="grid grid-2" style="margin-top:12px">${panel('ما قيمة العدد والقناة والفترة؟','معلومات مفيدة عندما يناسبها السؤال وتسمح حقوق استعمالها',`<p class="muted">يمكنها تحديد موضع سؤال عن التفاعل والتغطية. لا تثبت القناة مصدر اكتساب، ولا العدد أشخاصًا فريدين أو جودة عملاء أو بيعًا أو ربحًا.</p>${btn('سياق المبيعات والتحويل','goInquiries','tonal small')}`)}${panel('حقوق مستقلة','لا منح حقوق أو تنفيذ أو تصدير BF03 من هذا العرض',`<p class="muted">التسجيل والتصحيح والقراءة حقوق منفصلة في التطبيق. حق القراءة لا يمنح تلقائيًا التحليل أو المشاركة أو التصدير. إدارة هذه الإفادات لا تعتمد عمومًا على ربط إعلان أو إدخال هدف.</p>`)}</div>`}
function assertionDetail(){if(activeBusinessId.startsWith('local-'))return;modal('تعريف إفادة مجمّعة وتاريخها','مجموعة واحدة للتوضيح؛ لا بيانات أفراد أو تحقق مستقل',`<dl class="frozen-definition"><div><dt>أصل الرقم</dt><dd>${aggregateFixture.issuer}</dd></div><div><dt>الفترة</dt><dd>${aggregateFixture.period}</dd></div><div><dt>قناة التسجيل</dt><dd>${aggregateFixture.channel}</dd></div><div><dt>التعريف</dt><dd>${aggregateFixture.definition}</dd></div><div><dt>العدد الحالي</dt><dd>${fmt(aggregateFixture.count)}</dd></div><div><dt>القبول والتكلفة</dt><dd>غير معروفين؛ لا يتحول الغياب إلى صفر.</dd></div><div><dt>مصدر الاكتساب</dt><dd>غير معروف؛ النموذج ليس دليلاً على Google أو Meta.</dd></div></dl><h3 style="font-size:14px">تاريخ توضيحي محفوظ</h3><div class="row-list"><div class="row-item"><div class="grow"><strong>الإصدار الأول: ٩٦ تسجيلًا</strong><p>٧ أكتوبر؛ إفادة أولية تركيبية للفترة والقناة نفسيهما.</p></div></div><div class="row-item"><div class="grow"><strong>الإصدار الحالي: ١٠٠ تسجيل</strong><p>٨ أكتوبر؛ تصحيح تركيبي لأربع تسجيلات متأخرة، دون تغيير معنى المجموعة أو إعادة كتابة الأصل.</p></div></div></div><div class="stepnote">التصحيح الحقيقي يحتاج حقه الحالي، والتاريخ يحتاج حق قراءته. الأزرار التشغيلية لن تُختلق قبل حزمة التكامل المفوضة.</div>`,btn('إغلاق','closeModal'));}
function rememberFocus(){const e=document.activeElement;returnFocus=e?{id:e.id,action:e.dataset?.action,nav:e.dataset?.nav,tab:e.dataset?.tab}:null}
function restoreRememberedFocus(){let el=returnFocus?.id?document.getElementById(returnFocus.id):null;if(!el&&returnFocus)el=[...document.querySelectorAll('[data-action],[data-nav],[data-tab]')].find(e=>['action','nav','tab'].every(k=>(e.dataset[k]||'')===(returnFocus[k]||'')));(el||document.querySelector('.nav-item.active'))?.focus()}
function bindLabels(){document.querySelectorAll('form').forEach((form,fi)=>form.querySelectorAll('.field').forEach((field,i)=>{const label=field.querySelector('label'),control=field.querySelector('input,select,textarea');if(label&&control&&!label.contains(control)){if(!control.id)control.id='f-'+fi+'-'+i;label.htmlFor=control.id}}));document.querySelectorAll('input:not([aria-label]),select:not([aria-label]),textarea:not([aria-label])').forEach(e=>{if(!e.labels?.length&&!e.getAttribute('aria-labelledby'))e.setAttribute('aria-label',e.name||'خيار في النموذج')})}
function syncNavigation(){const sidebar=document.getElementById('sidebar'),shell=document.querySelector('.shell');let backdrop=document.getElementById('menuBackdrop');if(!backdrop){backdrop=document.createElement('div');backdrop.id='menuBackdrop';backdrop.className='menu-backdrop';backdrop.setAttribute('data-action','toggleMenu');document.body.appendChild(backdrop)}backdrop.classList.toggle('open',state.sidebarOpen);shell.inert=state.sidebarOpen;sidebar.inert=window.innerWidth<=700&&!state.sidebarOpen;document.querySelector('[data-action="toggleMenu"].mobile-menu')?.setAttribute('aria-expanded',String(state.sidebarOpen));if(state.sidebarOpen){sidebar.setAttribute('role','dialog');sidebar.setAttribute('aria-modal','true');sidebar.setAttribute('aria-label','قائمة الأقسام');document.body.style.overflow='hidden'}else{sidebar.removeAttribute('role');sidebar.removeAttribute('aria-modal');document.body.style.overflow=''}}


const unsentFormDrafts=new Map();
function formDraftKey(form){return (form.dataset.draftBusiness||activeBusinessId)+':'+form.id}
function captureUnsentForms(){document.querySelectorAll('form[id]').forEach(form=>{const key=formDraftKey(form);if(form.dataset.draftCommitted==='true'){unsentFormDrafts.delete(key);return}const values=[...form.querySelectorAll('input[name],select[name],textarea[name]')].filter(e=>!e.disabled&&e.type!=='file').map(e=>({name:e.name,type:e.type,value:e.value,checked:!!e.checked}));if(values.length)unsentFormDrafts.set(key,values)})}
function restoreUnsentForms(){document.querySelectorAll('form[id]').forEach(form=>{if(!form.dataset.draftBusiness)form.dataset.draftBusiness=activeBusinessId;if(form.dataset.draftBusiness!==activeBusinessId||form.dataset.draftCommitted==='true')return;const values=unsentFormDrafts.get(formDraftKey(form));if(!values)return;const controls=[...form.querySelectorAll('input[name],select[name],textarea[name]')].filter(e=>!e.disabled&&e.type!=='file');values.forEach((v,i)=>{const e=controls[i];if(!e||e.name!==v.name||e.type!==v.type)return;if(e.type==='checkbox'||e.type==='radio'){if(e.value===v.value)e.checked=v.checked}else e.value=v.value})});const slider=document.getElementById('budgetSlider'),output=document.getElementById('budgetValue');if(slider&&output)output.textContent=fmt(Number(slider.value))}
function discardSubmittedDraft(form){unsentFormDrafts.delete(formDraftKey(form));form.dataset.draftCommitted='true'}
function discardAllUnsentDrafts(){document.querySelectorAll('form[id]').forEach(f=>{f.dataset.draftCommitted='true'});unsentFormDrafts.clear()}

function render(){save();sidebar();topbar();const m=document.getElementById('main');const pages={home,market,plan,ads,sales,results,decisions,sources,settings};m.innerHTML=fixtureNotice()+pages[state.page]()+`<footer class="activityfoot">BuilderAd · خط أساس تصميم محلي · لا اتصال أو تنفيذ خارجي · ليس إثبات اكتمال القدرات</footer>`;bindLabels();syncNavigation();restoreUnsentForms();}
function navigate(p,tab){if(![...nav,...bottomNav].some(x=>x[0]===p))return;state.page=p;if(tab&&tabs[p]?.some(x=>x[0]===tab))state.tabs[p]=tab;state.sidebarOpen=false;closeModal(false);render();history.replaceState(null,'','#'+p+(tab?'/'+tab:''));window.scrollTo({top:0,behavior:'instant'});document.querySelector('#main h1')?.setAttribute('tabindex','-1');document.querySelector('#main h1')?.focus({preventScroll:true});}
function modal(title,subtitle,body,footer=''){captureUnsentForms();if(!document.querySelector('.modal-backdrop'))rememberFocus();state.sidebarOpen=false;render();document.getElementById('modalHost').innerHTML=`<div class="modal-backdrop" data-backdrop="true"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal-head"><div><h2 id="modalTitle">${title}</h2><p>${subtitle||''}</p></div><button type="button" class="close-x" aria-label="إغلاق" data-action="closeModal">${icon('close')}</button></div><div class="modal-body">${body}</div>${footer?`<div class="modal-foot">${footer}</div>`:''}</div></div>`;document.getElementById('app').inert=true;document.body.style.overflow='hidden';bindLabels();restoreUnsentForms();document.querySelector('.modal input,.modal select,.modal textarea,.modal button')?.focus();}
function closeModal(restore=true){captureUnsentForms();document.getElementById('modalHost').innerHTML='';document.getElementById('app').inert=false;document.body.style.overflow='';if(restore)restoreRememberedFocus();}
function evidence(which='case'){const d=data(),isFraud=which==='fraud';modal(isFraud?'فحص جودة الزيارات والحماية':'تفاصيل مسألة تستحق الانتباه','تقييم الدليل قبل التوصية أو الإجراء',`<div class="row-list"><div class="row-item">${icon('info')}<div class="grow"><strong>ما الذي ظهر؟</strong><p>${escapeHTML(isFraud?'احتمال وجود زيارات أو تحويلات غير مؤهلة (حالة تعليمية).':d.headline)}</p></div>${badge('تدريبي','blue')}</div><div class="row-item">${icon('search')}<div class="grow"><strong>ما الدليل؟</strong><p>لا توجد سجلات تشغيلية متصلة؛ الوصف والأرقام أمثلة توضيحية فقط.</p></div>${badge('غير مثبت','amber')}</div><div class="row-item">${icon('alert')}<div class="grow"><strong>ما الذي لا يمكن الجزم به؟</strong><p>${isFraud?'قيمة الأموال المهدرة أو حصول احتيال فعلي، خصوصًا ما استبعدته المنصات.':'سبب التعثر أو أثر إعلان محدد أو حجم الخسارة المالي.'}</p></div></div><div class="row-item">${icon('checks')}<div class="grow"><strong>الخطوة المفيدة</strong><p>تأهيل مصدر النتيجة، مراجعة التعريفات، ثم إعداد اختبار قابل للمقارنة.</p></div></div></div>`,`${btn('أغلق','closeModal')}${btn('أضف فحصًا إلى قراراتي',isFraud?'fraudDecision':'caseDecision','primary')}`);}
function addDecision(title,source,note,kind='تحليل'){let id='D-'+String(Date.now()).slice(-6);state.decisions.unshift({id,title,source,note,status:'reviewing',created:'أضيف محليًا',kind});track('أضيف قرار للمراجعة: '+title);toast('أُضيف قرار للمراجعة داخل النموذج؛ لم يحدث تنفيذ خارجي.');render();return id;}
function showDecision(id){const d=state.decisions.find(x=>x.id===id);if(!d)return;modal('مراجعة محلية',decisionStatus(d.status),`<div class="row-list"><div class="row-item"><div class="grow"><strong>${escapeHTML(d.title)}</strong><p>${escapeHTML(d.source)}</p></div></div><div class="row-item"><div class="grow"><strong>الدليل أو السؤال</strong><p>${escapeHTML(d.note)}</p></div></div><div class="row-item"><div class="grow"><strong>التنفيذ والأثر</strong><p>غير معروفين؛ لا ينتجان من تغيير حالة المراجعة في هذا الملف.</p></div></div></div>`,`${btn('إغلاق','closeModal')}${['reviewing','completed','deferred'].map(s=>btn(decisionStatus(s),'decisionState:'+id+':'+s,s===d.status?'tonal':'')).join('')}`);}
function searchModal(){let items=[...nav,...bottomNav].map(([id,label,ic])=>({label,route:id,tab:null,icon:ic}));Object.entries(tabs).forEach(([n,arr])=>arr.forEach(([id,label])=>items.push({label,route:n,tab:id,icon:'search'})));items.push({label:'إفادات الاستفسارات',route:'settings',tab:'data',icon:'receipt'});window._searchItems=items;modal('بحث سريع','انتقل إلى الوظيفة المطلوبة مباشرة',`<label for="globalSearch">ابحث باسم القسم أو الوظيفة</label><input type="search" id="globalSearch" placeholder="مثل: الاستهداف، الحماية، العروض، الإسناد" autocomplete="off" /><div id="searchResults" class="search-list" style="margin-top:11px"></div>`);document.getElementById('globalSearch')?.focus();drawSearch('');}
function drawSearch(v){let root=document.getElementById('searchResults');if(!root)return;let r=window._searchItems.filter(x=>x.label.includes(v.trim())).slice(0,13);root.innerHTML=r.length?r.map(x=>`<button type="button" class="search-result" data-action="searchGo:${x.route}:${x.tab||''}">${icon(x.icon,'sm')}<span>${escapeHTML(x.label)}</span>${icon('chevron','sm')}</button>`).join(''):'<p class="muted small">لا توجد وظيفة مطابقة.</p>';}
function activityModal(){save();modal('اختر نشاطًا محليًا','لكل نشاط مسوداته ومراجعاته المستقلة. التبديل لا يمحو العمل السابق.',`<div class="grid">${Object.entries(businessBank).map(([id,d])=>`<button type="button" class="feature" data-action="activity:${escapeHTML(id)}" style="width:100%;text-align:right">${icon('building')}<div><h3>${escapeHTML(d.business.name)} ${id===activeBusinessId?badge('الحالي','green'):''}</h3><p>${escapeHTML(scenarios[d.sector].type)} · ${escapeHTML(d.business.market)}</p></div></button>`).join('')}</div><div style="margin-top:13px">${btn('نشاط محلي جديد','newBusiness','primary')}</div>`);}
function newBusiness(){modal('إعداد نشاط جديد','ابدأ من نشاطك وسوقك، دون اشتراط ربط منصة إعلانية',`<form id="newBusinessForm" class="formgrid"><div class="field"><label>اسم النشاط</label><input name="name" required maxlength="65" placeholder="اسم شركتك أو متجرك" /></div><div class="field"><label>القطاع</label><select name="sector"><option value="commerce">تجارة إلكترونية</option><option value="realestate">عقارات</option><option value="service">خدمات</option></select></div><div class="field full"><label>ماذا تقدم؟</label><input name="offer" required maxlength="110" placeholder="المنتجات أو الخدمات الأساسية" /></div><div class="field full"><label>السوق المستهدف</label><input name="market" required maxlength="100" placeholder="مثال: الرياض، السعودية" /></div><div class="field full"><label>غاية تجارية، إن وجدت</label><input name="goal" maxlength="180" placeholder="اختياري: زيادة الطلبات المكتملة" /></div><div class="field full"><button class="btn primary" type="submit">حفظ النشاط وفتح لوحة المعلن</button></div></form><div class="stepnote" style="margin-top:12px">هذه تجربة إعداد محلية: سيبدأ نشاطك بلا مصادر متصلة، ولن نملأ النتائج بأرقام مفترضة.</div>`);}

function newDecision(){modal('قرار جديد','سجل ما تحتاج مراجعته دون ادعاء تنفيذه',`<form id="newDecisionForm" class="formgrid"><div class="field full"><label>عنوان القرار</label><input name="title" maxlength="150" required placeholder="مثل: مراجعة جودة الاستفسارات"/></div><div class="field full"><label>سبب القرار أو دليل مطلوب</label><textarea name="note" required maxlength="500" placeholder="ما الذي عرفته أو ما الذي تحتاج إلى التحقق منه؟"></textarea></div><div class="field full"><button type="submit" class="btn primary">أضف قرارًا للمراجعة</button></div></form>`);}
function infoModal(kind){const text={codeScope:['العلاقة بالكود الحالي','فرع main راجعنا فيه Vue SPA ومسارات النشاط والأهداف وموصلات Meta وGoogle وTikTok وSnapchat وX، بالإضافة إلى حدود الصلاحيات وحفظ إفادات الاستفسارات المجمّعة. هذا الملف مرجع تصميم مستقل لا يستدعي الواجهات. إفادات BF03 المجمّعة ليست CRM، وتكاملها يحتاج حزمة تنفيذ مستقلة.'],sourceExplain:['صلاحية البيانات','تتطلب النتائج مصدرًا معروفًا وتاريخًا وصلاحية وحق استعمال. الإسناد لا يثبت نتيجة تجارية وحده.'],budgetExplain:['التوزيع قبل التنفيذ','الميزانية قرار تجاري مشروط بهامش الربح والطلب والسعة والنتائج المؤهلة. اختر الإعلانات ← الميزانيات لتجربة تسجيل قرار بدون تنفيذه.']};let m=text[kind]||['شرح','معلومات توضيحية'];modal(m[0],'حدود النموذج',[`<p style="margin:0 0 15px">${m[1]}</p>`,`<div class="callout">${icon('info')}<div>لا يوجد تكامل خارجي في هذا الملف، وجميع التغييرات تظل داخل المتصفح.</div></div>`].join(''),btn('حسنًا','closeModal','primary'));}
function providerModal(id){modal('الربط بالمصادر','المدخل الصحيح من التطبيق الفعلي وليس من ملف HTML',`<div class="row-list"><div class="row-item">${icon('shield')}<div class="grow"><strong>اتصال بإذن من صاحب الحساب</strong><p>استخدام مسار اعتماد مصمم للمزود ونطاق العمل المناسب.</p></div></div><div class="row-item">${icon('lock')}<div class="grow"><strong>حق القراءة منفصل عن حق التنفيذ</strong><p>لا يجب استنتاج صلاحية إدارة الحملات من صلاحية قراءة التقرير.</p></div></div><div class="row-item">${icon('clock')}<div class="grow"><strong>جاهزية محدثة</strong><p>التحقق من صلاحية الرموز والتغطية ومواعيد البيانات وأهلية الاستعمال.</p></div></div></div><div class="callout warning" style="margin-top:12px">${icon('alert')}<div>لم تتم محاولة ربط ${escapeHTML(id)}. الأزرار في هذا النموذج تشرح التجربة فقط.</div></div>`,btn('إغلاق','closeModal'));}
function exportSummary(){let obj={disclaimer:'LOCAL DESIGN DEMO ONLY; NO BF03 EVIDENCE EXPORT OR REAL DATA RIGHTS; NOT VERIFIED OR EXECUTED',activity:{name:business().name,sector:data().type,offer:business().offer,market:business().market,goal:business().goal},mode:state.mode,decisions:state.decisions,audit:state.audit};const b=new Blob([JSON.stringify(obj,null,2)],{type:'application/json;charset=utf-8'});const url=URL.createObjectURL(b),a=document.createElement('a');a.href=url;a.download='builderad-ux-demo-work.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),500);toast('صُدّر عمل التصميم المحلي فقط؛ لا إفادات BF03 أو بيانات حقيقية.');}
function handleAction(code){if(code==='closeModal')return closeModal();if(code==='toggleMenu'){if(!state.sidebarOpen)rememberFocus();state.sidebarOpen=!state.sidebarOpen;render();if(state.sidebarOpen)document.querySelector('.sidebar-close')?.focus();else restoreRememberedFocus();return;}if(code==='search')return searchModal();if(code==='activitySwitch')return activityModal();if(code==='newBusiness')return newBusiness();if(code.startsWith('activity:')){const id=code.slice(9);if(!businessBank[id])return;save();const oldPage=state.page;activeBusinessId=id;state=JSON.parse(JSON.stringify(businessBank[id]));state.page=oldPage;state.sidebarOpen=false;closeModal(false);render();toast('انتقلت إلى نشاط مستقل؛ بقيت مسودات النشاط السابق محفوظة.');return;}if(code==='modeSample'||code==='modeEmpty'||code==='toggleMode'){state.mode=code==='modeSample'?'sample':code==='modeEmpty'?'empty':hasSample()?'empty':'sample';render();toast(state.mode==='empty'?'وضع بلا مصادر: اختفت الأرقام التدريبية.':'تم إظهار البيانات التدريبية الافتراضية.');return;}if(code==='editGoal')return navigate('plan','goals');if(code==='goMarket')return navigate('market','demand');if(code==='goPlan')return navigate('plan','channels');if(code==='goMessage')return navigate('plan','message');if(code==='goDecisions')return navigate('decisions','records');if(code==='goSources')return navigate('sources');if(code==='goSignals')return navigate('results','signals');if(code==='goInquiries')return navigate('sales','inquiries');if(code==='goAssertions')return navigate('settings','data');if(code==='assertionDetail')return assertionDetail();if(code==='caseEvidence')return evidence();if(code==='fraudEvidence')return evidence('fraud');if(['codeScope','sourceExplain','budgetExplain'].includes(code))return infoModal(code);if(code==='marketOpportunity')return navigate('market','demand');if(code==='caseDecision'){addDecision('مراجعة سبب تغير التحويل التجاري','الرئيسية',data().reason);closeModal();navigate('decisions','records');return;}if(code==='fraudDecision'){addDecision('التحقق من جودة الزيارات قبل تقدير أي خسارة','الإعلانات','لا توجد خسارة مؤكدة؛ يلزم استبعاد النقرات المفوترة والمعالجة.');closeModal();navigate('decisions','records');return;}if(code==='planDecision'){addDecision('اختبار ملاءمة العرض وقنوات الوصول','العروض والخطة','تتطلب مقارنة مناسبة وخطة اختبار.');navigate('decisions','records');return;}if(code==='signalDecision'){addDecision('مراجعة مصادر التحويل والتكرار','النتائج والعائد','الإسناد يختلف عن النتيجة التجارية.');navigate('decisions','records');return;}if(code==='experimentDecision'){addDecision('تصميم تجربة تجارية صغيرة','القرارات والتحسين','يجب تحديد فرضية ومعيار نجاح ومدة وبيانات مؤهلة.','تجربة');navigate('decisions','records');return;}if(/^opp[0-9]+$/.test(code)){let i=Number(code.slice(3)),x=data().opps[i];if(!x)return;modal('تقييم فرصة افتراضية',x[0],`<div class="row-list"><div class="row-item">${icon('compass')}<div class="grow"><strong>لماذا تستحق النظر؟</strong><p>${escapeHTML(x[1])}</p></div></div><div class="row-item">${icon('search')}<div class="grow"><strong>ما الدليل؟</strong><p>لا يوجد مصدر سوق حقيقي في هذا HTML؛ هذه فرضية نموذج تجربة.</p></div></div><div class="row-item">${icon('checks')}<div class="grow"><strong>كيف نختبرها؟</strong><p>تأهيل مصدر، ثم اختبار عرض أو قناة أو منطقة بمؤشر نجاح معروف.</p></div></div></div>`,`${btn('إغلاق','closeModal')}<button class="btn primary" data-action="oppDecision:${i}">أضف إلى قراراتي</button>`);return;}if(code.startsWith('oppDecision:')){let x=data().opps[Number(code.split(':')[1])];if(x){addDecision('فحص فرصة: '+x[0],'السوق والعملاء',x[1]);closeModal();navigate('decisions','records')}return;}if(/^campaign[0-9]+$/.test(code)){let c=data().campaigns[Number(code.slice(8))];if(c)modal('الحملة التدريبية',c[0],`<p class="muted">${escapeHTML(c[1])} · إنفاق افتراضي ${money(c[2])}</p><div class="callout warning">${icon('alert')}<div>لا توجد قراءة من API ولا إمكانية لتعديل الحملة من هذا الملف.</div></div>`,`${btn('إغلاق','closeModal')}${btn('سجل مراجعة للحملة','campaignReview','primary')}`);return;}if(code==='campaignReview'){addDecision('مراجعة حملة قبل أي تغيير','الإعلانات','يلزم التحقق من البيانات والصلاحيات والنتيجة.');closeModal();navigate('decisions','records');return;}if(code==='newDecision')return newDecision();if(code.startsWith('decision:'))return showDecision(code.split(':')[1]);if(code.startsWith('decisionState:')){const [,id,s]=code.split(':');const d=state.decisions.find(x=>x.id===id);if(!d||!['reviewing','completed','deferred'].includes(s))return;d.status=s;track('تحديث حالة المراجعة المحلية إلى '+decisionStatus(s));showDecision(id);return;}if(code.startsWith('connectHelp:'))return providerModal(code.split(':')[1]);if(code.startsWith('searchGo:')){let [,page,tab]=code.split(':');return navigate(page,tab||undefined);}if(code==='copyMessage'){navigator.clipboard?.writeText(state.draftMessage).then(()=>toast('تم نسخ الرسالة.')).catch(()=>toast('النسخ غير متاح في هذا المتصفح.'));return;}if(code==='export')return exportSummary();if(code==='reset'){modal('إعادة ضبط النموذج','يمسح السجلات والتعديلات التدريبية من هذا المتصفح فقط',`<p class="muted">لن يتغير أي نظام فعلي. ستعود السيناريوهات والسجلات الافتراضية إلى حالتها الأولى.</p>`,`${btn('إلغاء','closeModal')}<button class="btn danger" data-action="confirmReset">أعد ضبط التجربة</button>`);return;}if(code==='confirmReset'){discardAllUnsentDrafts();businessBank={};activeBusinessId='sample-commerce';state=fresh();seedBusinessBank();save();closeModal();render();toast('أُعيد ضبط النموذج محليًا.');return;}}
function safeSubmit(form){discardSubmittedDraft(form);let fd=new FormData(form),id=form.id;if(id==='newBusinessForm'){const sector=String(fd.get('sector'));if(!scenarios[sector])return;save();const next=fresh();next.sector=sector;next.business={...scenarios[sector],name:String(fd.get('name')).trim(),offer:String(fd.get('offer')).trim(),market:String(fd.get('market')).trim(),goal:String(fd.get('goal')||'').trim()};next.mode='empty';next.page='home';next.decisions=[];next.manual=[];next.audit=[];activeBusinessId='local-'+Date.now().toString(36);state=next;track('إنشاء نشاط محلي دون مصدر خارجي');closeModal(false);render();toast('أُنشئ النشاط مستقلاً؛ لم تُنسخ إليه بيانات أو مراجعات النشاط السابق.');return;}if(id==='businessForm'){const sector=String(fd.get('sector'));if(!scenarios[sector])return;state.sector=sector;state.business={...state.business,name:String(fd.get('name')).trim(),offer:String(fd.get('offer')).trim(),market:String(fd.get('market')).trim(),goal:String(fd.get('goal')||'').trim()};track('تعديل معلومات يصرّح بها النشاط؛ لم تتغير الأدلة الأصلية');render();toast('حُفظ السياق المعلن لهذا النشاط فقط.');return;}
if(id==='offerForm'){state.business.offer=String(fd.get('offer')).trim();state.draftMessage=String(fd.get('message')).trim();track('تعديل العرض التجاري المعلن');render();toast('حُفظ العرض والمسودة محليًا.');return;}
if(id==='messageForm'){state.draftMessage=String(fd.get('message')).trim();track('حفظ مسودة رسالة تجارية');render();toast('حُفظت المسودة محليًا.');return;}
if(id==='goalForm'){state.business.goal=String(fd.get('goal')).trim();track('تعديل الغاية المعلنة دون تغيير الأدلة التاريخية');render();toast('حُدثت الغاية المعلنة محليًا.');return;}
if(id==='channelsForm'){state.channels=fd.getAll('channel').map(String);const val=document.getElementById('budgetSlider');state.budget=Number(val?.value||5000);addDecision('مراجعة خطة الوصول وقنواتها','العروض والخطة',`قنوات مرشحة: ${state.channels.join('، ')||'لم تُختر'}؛ حد افتراضي ${state.budget} ${data().currency}`);navigate('decisions','records');return;}
if(id==='budgetForm'){state.budget=Number(fd.get('budget'));addDecision('مراجعة توزيع ميزانية '+fmt(state.budget)+' '+data().currency,'الإعلانات','حد افتراضي لم يحرك أموالًا أو حملات.');navigate('decisions','records');return;}
if(id==='competitorForm'){let name=String(fd.get('competitor')).trim(),factor=String(fd.get('factor')),note=String(fd.get('observation')).trim();addDecision('مقارنة بديل: '+name,'السوق والعملاء',`${factor}: ${note}. هذه إفادة محلية غير موثقة.`);navigate('decisions','records');return;}
if(id==='manualForm'){let kind=String(fd.get('kind')),value=Number(fd.get('value'));state.manual.unshift({kind,value});track('إضافة إفادة نتيجة غير متحققة: '+kind);render();toast('أُضيف التصريح المحلي. لم يتحول إلى نتيجة موثقة.');return;}
if(id==='newDecisionForm'){addDecision(String(fd.get('title')).trim(),'قرار أنشأه المستخدم',String(fd.get('note')).trim());closeModal();navigate('decisions','records');return;}}
document.addEventListener('click',e=>{let navEl=e.target.closest('[data-nav]');if(navEl){e.preventDefault();navigate(navEl.dataset.nav);return;}let tabEl=e.target.closest('[data-tab]');if(tabEl){e.preventDefault();let [n,t]=tabEl.dataset.tab.split(':');if(!tabs[n]?.some(x=>x[0]===t))return;state.tabs[n]=t;render();document.querySelector('[data-tab="'+n+':'+t+'"]')?.focus();return;}let a=e.target.closest('[data-action]');if(a){e.preventDefault();handleAction(a.dataset.action);return;}if(e.target.matches('[data-backdrop]'))closeModal();});
document.addEventListener('submit',e=>{let f=e.target;if(!(f instanceof HTMLFormElement))return;e.preventDefault();if(!f.reportValidity())return;safeSubmit(f);});
document.addEventListener('input',e=>{if(e.target.id==='globalSearch')drawSearch(e.target.value);if(e.target.id==='budgetSlider'){let s=document.getElementById('budgetValue');if(s)s.textContent=fmt(Number(e.target.value));}});
document.addEventListener('keydown',e=>{const dialog=document.querySelector('.modal');if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();if(!dialog)searchModal()}if(e.key==='Escape'){if(dialog)closeModal();else if(state.sidebarOpen){state.sidebarOpen=false;render();restoreRememberedFocus()}}if(e.key==='Tab'&&(dialog||state.sidebarOpen)){const root=dialog||document.getElementById('sidebar');const all=[...root.querySelectorAll('button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),a[href]')].filter(el=>el.getClientRects().length&&!el.closest('[inert]'));if(all.length){if(e.shiftKey&&document.activeElement===all[0]){e.preventDefault();all.at(-1).focus()}else if(!e.shiftKey&&document.activeElement===all.at(-1)){e.preventDefault();all[0].focus()}}}});
window.addEventListener('resize',()=>{if(window.innerWidth>700&&state.sidebarOpen){state.sidebarOpen=false;render()}else syncNavigation()});
const [hash,localTab]=(location.hash||'').replace(/^#\/?/,'').split('/');if([...nav,...bottomNav].some(x=>x[0]===hash)){state.page=hash;if(tabs[hash]?.some(x=>x[0]===localTab))state.tabs[hash]=localTab;}
render();
})();
</script>
</body></html>
