function chart(){let d=data(),ns=d.series;const max=Math.max(...ns),points=ns.map((n,i)=>`${18+i*(510/(ns.length-1))},${110-(n/max)*82}`).join(' ');return `<svg class="linechart" viewBox="0 0 550 128" role="img" aria-label="منحنى توضيحي لاتجاه النتائج عبر سبع نقاط افتراضية" preserveAspectRatio="none"><path class="gridline" d="M0 32H550M0 72H550M0 112H550"/><polyline class="trend" points="${points}"/>${ns.map((n,i)=>`<circle class="point" cx="${18+i*(510/(ns.length-1))}" cy="${110-(n/max)*82}" r="3"/>`).join('')}</svg><div class="linedates"><span>بداية الفترة</span><span>منتصف الفترة</span><span>نهاية الفترة</span></div>`;}

function decisionStatus(s){return ({proposed:'مقترح',approved:'موافقة داخل النموذج',logged:'تنفيذ مُسجّل يدويًا',review:'تحت مراجعة الأثر',closed:'أُغلق محليًا'})[s]||s;}
function decisionBadge(s){return badge(decisionStatus(s),s==='proposed'?'amber':s==='approved'?'blue':'green');}
function decisionRow(z){return `<div class="row-item">${icon('checks')}<div class="grow"><strong>${escapeHTML(z.title)}</strong><p>${escapeHTML(z.source)} · ${escapeHTML(z.note||'')}</p></div>${decisionBadge(z.status)}<button class="btn small" data-action="decision:${z.id}">فتح</button></div>`;}
function decisions(){let t=state.tabs.decisions,c='';if(t==='improvements'){c=`<div class="grid grid-2">${panel('تدخلات مقترحة','الترتيب لا يعني أنها إجراءات مثبتة الجدوى',`<div class="row-list">${[[data().headline,'مطلوب قياس سبب التعثر قبل تغيير الحملة','caseDecision'],['راجع ملاءمة العرض والقناة','مراجعة قيد التشغيل أو التوافر مع القناة','planDecision'],['تحقق من جودة الإشارات','مراجعة التكرار والتعريفات قبل تفسير العائد','signalDecision']].map(x=>`<div class="row-item">${icon('bulb')}<div class="grow"><strong>${escapeHTML(x[0])}</strong><p>${x[1]}</p></div><button class="btn small" data-action="${x[2]}">أضف</button></div>`).join('')}</div>`)}${panel('من التوصية إلى النتيجة','فصل دقيق بين الحالات التشغيلية',`<div class="row-list">${[['مقترح','يوضح البديل والسبب والدليل المطلوب'],['موافق عليه','تم تسجيل موافقة في هذا النموذج فقط'],['تنفيذ مسجل','إفادة يدوية لا تعني تأكيد منصة خارجية'],['مراجعة الأثر','تحتاج نتيجة ملائمة وزمنًا ومقارنة صحيحة']].map(x=>`<div class="row-item"><div class="grow"><strong>${x[0]}</strong><p>${x[1]}</p></div></div>`).join('')}</div>`)}</div>`;}if(t==='records'){c=`${panel('سجل القرارات','حالات تفاعلية محفوظة في هذا المتصفح فقط',`<div class="compact-row" style="margin-bottom:12px"><p class="muted small" style="margin:0">يمكنك إنشاء قرار ومراجعته وتسجيل إجراء يدوي، لكن لا يحدث تنفيذ خارجي.</p>${btn(`${icon('plus')} قرار جديد`,'newDecision','primary small')}</div><div class="row-list">${state.decisions.map(decisionRow).join('')}</div>`)}`;}if(t==='experiments'){c=`${panel('التجارب','جرب سؤالًا واحدًا بمعيار نجاح واضح',`<div class="grid grid-2">${[['اختبار رسالة','قارن صياغتين لعرض واحد، ولا تغيّر عوامل كثيرة في وقت واحد.'],['اختبار قناة وصول','قارن جهتين قابلتين للمقارنة عندما تسمح الشروط.'],['اختبار تحسن تجاري','حدد معيار نتيجة واقعية وعينة وزمنًا مناسبين.'],['تجربة الأثر السببي','لا تبدأ قبل كفاية البيانات وإمكان التصميم المقبول.']].map(x=>`<div class="feature">${icon('bulb')}<div><h3>${x[0]}</h3><p>${x[1]}</p></div></div>`).join('')}</div><div style="height:12px"></div>${btn('أنشئ تجربة للمراجعة','experimentDecision','tonal')}`)}`;}if(t==='impact'){c=`<div class="grid grid-2">${panel('مراجعة الأثر','لا يعني اكتمال إجراء إثبات فائدته',`<div class="row-list">${state.decisions.filter(z=>['logged','review','closed'].includes(z.status)).map(decisionRow).join('')||'<p class="muted small">لم يُسجل أي تنفيذ يدوي للمراجعة بعد.</p>'}</div>`)}${panel('سجل حركة النموذج','أحداث محلية للتجربة فقط',`<div class="timeline">${state.audit.slice(0,6).map(x=>`<div class="timeentry"><strong>${escapeHTML(x.text)}</strong><p>${escapeHTML(x.time)}</p></div>`).join('')||'<p class="muted small">سجل التفاعل فارغ.</p>'}</div>`)}</div>`;}
return `${header('القرارات والمتابعة','اختر تدخلًا مبررًا، واحتفظ بسجله، وافصل التنفيذ عن قياس الأثر.',btn(`${icon('plus')} قرار جديد`,'newDecision','primary'))}${tabsView('decisions')}${c}`;}
function sources(){let providers=[['Meta Ads','meta','مصدر إعلانات'],['Google Ads','google','مصدر إعلانات'],['TikTok Ads','tik','مصدر إعلانات'],['Snapchat Ads','snap','مصدر إعلانات'],['X Ads','x','مصدر إعلانات']];return `${header('المصادر والتكاملات','الربط، الاستيراد، حالة المصدر، وحقوق الاستعمال. لا توجد اتصالات فعلية داخل النموذج.',btn(`${icon('info')} ما الذي يدعمه الكود؟`,'codeScope','tonal'))}<div class="grid grid-3">${providers.map(([name,id,type])=>`<div class="sourcecard"><div class="sourcebadge">${name.split(' ')[0].slice(0,1)}</div><div style="flex:1"><strong>${name}</strong><p>${type} · لا يوجد ربط حقيقي في ملف HTML</p>${badge('غير متصل','amber')}<div style="height:10px"></div><button type="button" class="btn small" data-action="connectHelp:${id}">${icon('link','sm')} متطلبات الربط</button></div></div>`).join('')}</div><h2 class="section-heading">حالة الأدلة <small>التصريح أو المثال التدريبي ليس نتيجة موثقة من مصدر خارجي</small></h2><div class="grid grid-2">${panel('استيراد وإدخال يدوي','حدود الدلالة قبل الإفادة',`<div class="row-list">${[['تصريحات النشاط','تعديلات النشاط والغاية'],['الاستفسارات','سجلات تدريبية يدوّنها المستخدم داخل المتصفح'],['النتائج التجارية','إفادة يدوية تحتاج إثباتًا مستقلًا']].map(x=>`<div class="row-item">${icon('receipt','sm')}<div class="grow"><strong>${x[0]}</strong><p>${x[1]}</p></div></div>`).join('')}</div>${btn('أدخل إفادة نتيجة','goSignals','tonal small')}`)}${panel('حقوق المصدر والصلاحيات','نطاقات حقيقية موجودة في المستودع ولكن لا تعمل داخل هذا الملف',`<div class="callout">${icon('lock')}<div>إن الاتصال بمزود لا يمنح تلقائيًا حق قراءة كل بيانات النشاط أو إجراء تغييرات إعلانية. الصلاحيات والتكاملات الحقيقية تبقى في التطبيق الخلفي.</div></div><div class="row-list" style="margin-top:12px"><div class="row-item">${icon('shield')}<div class="grow"><strong>هوية ونطاق استخدام</strong><p>مراجعة الأذونات عند كل أثر محمي</p></div></div><div class="row-item">${icon('clock')}<div class="grow"><strong>حالة حديثة للمصدر</strong><p>لا نعتبر ربطًا تاريخيًا صلاحية سارية دائمًا</p></div></div></div>`)}</div>`;}
function settings(){return `${header('النشاط والفريق والإعدادات','تعريف نشاطك، واتجاهه، وحقوق الوصول. هذه الشاشة تمثل التعديلات المحلية فقط.',btn(`${icon('refresh')} إعادة ضبط النموذج`,'reset','ghost'))}<div class="grid grid-2">${panel('معلومات النشاط','السياق الذي تستند إليه الأقسام المختلفة',`<form id="businessForm" class="formgrid"><div class="field"><label>اسم النشاط</label><input name="name" required maxlength="65" value="${escapeHTML(business().name)}"></div><div class="field"><label>القطاع</label><select name="sector"><option value="commerce" ${state.sector==='commerce'?'selected':''}>تجارة إلكترونية</option><option value="realestate" ${state.sector==='realestate'?'selected':''}>عقارات</option><option value="service" ${state.sector==='service'?'selected':''}>خدمات</option></select></div><div class="field full"><label>المنتج أو الخدمة</label><input name="offer" required maxlength="110" value="${escapeHTML(business().offer)}"></div><div class="field full"><label>السوق</label><input name="market" required maxlength="100" value="${escapeHTML(business().market)}"></div><div class="field full"><label>الغاية التجارية</label><input name="goal" required maxlength="180" value="${escapeHTML(business().goal)}"></div><div class="field full"><button class="btn primary" type="submit">حفظ معلومات النشاط</button></div></form>`)}${panel('الفريق والصلاحيات','تصور حد الاستخدام وليس لوحة منح تشغيلية',`<div class="row-list">${[['مدير النشاط','الموافقة على القرارات ضمن حقه'],['المسوّق','تجهيز توصيات بحسب النطاق المسموح'],['المراجع','قراءة أدلة محددة دون تنفيذ إجراءات'],['مصدر البيانات','أصل مستقل وتاريخ وصلاحية']].map(x=>`<div class="row-item">${icon('lock','sm')}<div class="grow"><strong>${x[0]}</strong><p>${x[1]}</p></div>${badge('تصميم')}</div>`).join('')}</div><div class="stepnote" style="margin-top:12px">لا يمكن لهذا النموذج المصادقة أو منح وصول أو إدارة أسرار حسابات.</div>`)}</div><h2 class="section-heading">تفضيلات تجربة النموذج</h2><div class="grid grid-2">${panel('عرض البيانات','اختبر تجربة ببيانات تدريبية أو دون مصادر',`<div class="toggle-line"><div><strong>إظهار أمثلة مؤشرات ونتائج</strong><div class="muted small">لا يتغير أي مصدر حقيقي</div></div><button class="switch" type="button" role="switch" aria-label="إظهار البيانات التدريبية" aria-checked="${hasSample()}" data-action="toggleMode"></button></div>`)}${panel('ملفات وتجربة المستخدم','فقط بيانات هذا المتصفح التجريبية',`${btn(`${icon('download')} تصدير ملخص النموذج`,'export','tonal')}${btn(`${icon('refresh')} محو البيانات التدريبية`,'reset','danger')}`, '')}</div>`;}
function render(){sidebar();topbar();const m=document.getElementById('main');let pages={home,market,plan,ads,sales,results,decisions,sources,settings};m.innerHTML=fixtureNotice()+pages[state.page]()+`<footer class="activityfoot">BuilderAd · نموذج واجهة مستقل مستند إلى خطة المنتج ومسارات المستودع · لا اتصال بالخادم ولا تنفيذ خارجي</footer>`;save();}
function navigate(p,tab){if(![...nav,...bottomNav].some(x=>x[0]===p))return;state.page=p;if(tab&&tabs[p]?.some(x=>x[0]===tab))state.tabs[p]=tab;state.sidebarOpen=false;document.getElementById('modalHost').innerHTML='';render();window.scrollTo({top:0,behavior:'instant'});}
function modal(title,subtitle,body,footer=''){document.getElementById('modalHost').innerHTML=`<div class="modal-backdrop" data-backdrop="true"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal-head"><div><h2 id="modalTitle">${title}</h2><p>${subtitle||''}</p></div><button type="button" class="close-x" aria-label="إغلاق" data-action="closeModal">${icon('close')}</button></div><div class="modal-body">${body}</div>${footer?`<div class="modal-foot">${footer}</div>`:''}</div></div>`;const first=document.querySelector('.modal button,.modal input,.modal select');first?.focus();}
function closeModal(){document.getElementById('modalHost').innerHTML='';}
function evidence(which='case'){const d=data(),isFraud=which==='fraud';modal(isFraud?'فحص جودة الزيارات والحماية':'تفاصيل مسألة تستحق الانتباه','تقييم الدليل قبل التوصية أو الإجراء',`<div class="row-list"><div class="row-item">${icon('info')}<div class="grow"><strong>ما الذي ظهر؟</strong><p>${escapeHTML(isFraud?'احتمال وجود زيارات أو تحويلات غير مؤهلة (حالة تعليمية).':d.headline)}</p></div>${badge('تدريبي','blue')}</div><div class="row-item">${icon('search')}<div class="grow"><strong>ما الدليل؟</strong><p>لا توجد سجلات تشغيلية متصلة؛ الوصف والأرقام أمثلة توضيحية فقط.</p></div>${badge('غير مثبت','amber')}</div><div class="row-item">${icon('alert')}<div class="grow"><strong>ما الذي لا يمكن الجزم به؟</strong><p>${isFraud?'قيمة الأموال المهدرة أو حصول احتيال فعلي، خصوصًا ما استبعدته المنصات.':'سبب التعثر أو أثر إعلان محدد أو حجم الخسارة المالي.'}</p></div></div><div class="row-item">${icon('checks')}<div class="grow"><strong>الخطوة المفيدة</strong><p>تأهيل مصدر النتيجة، مراجعة التعريفات، ثم إعداد اختبار قابل للمقارنة.</p></div></div></div>`,`${btn('أغلق','closeModal')}${btn('أضف فحصًا إلى قراراتي',isFraud?'fraudDecision':'caseDecision','primary')}`);}
function addDecision(title,source,note,kind='تحليل'){let id='D-'+String(Date.now()).slice(-6);state.decisions.unshift({id,title,source,note,status:'proposed',created:'أضيف محليًا',kind});track('أضيف قرار للمراجعة: '+title);toast('أُضيف قرار للمراجعة داخل النموذج؛ لم يحدث تنفيذ خارجي.');render();return id;}
function showDecision(id){const d=state.decisions.find(x=>x.id===id);if(!d)return;modal('مراجعة القرار',d.id+' · '+decisionStatus(d.status),`<div class="row-list"><div class="row-item"><div class="grow"><strong>القرار</strong><p>${escapeHTML(d.title)}</p></div></div><div class="row-item"><div class="grow"><strong>مصدره</strong><p>${escapeHTML(d.source)}</p></div></div><div class="row-item"><div class="grow"><strong>الدليل والقيود</strong><p>${escapeHTML(d.note)}</p></div></div><div class="row-item"><div class="grow"><strong>الحالة الحالية</strong><p>${decisionStatus(d.status)} · سجّل داخل نموذج HTML فقط</p></div></div></div><div class="callout warning" style="margin-top:14px">${icon('alert')}<div>الموافقة أو تسجيل التنفيذ هنا لا يرسل أي أمر إلى مزود إعلانات أو CRM، ولا يثبت أثرًا تجاريًا.</div></div>`,`${btn('إغلاق','closeModal')}${d.status==='proposed'?`<button class="btn primary" data-action="decisionAdvance:${d.id}">موافقة داخل النموذج</button>`:d.status==='approved'?`<button class="btn primary" data-action="decisionAdvance:${d.id}">سجّل تنفيذًا يدويًا</button>`:d.status==='logged'?`<button class="btn primary" data-action="decisionAdvance:${d.id}">ابدأ مراجعة الأثر</button>`:''}`);}
function searchModal(){let items=[...nav,...bottomNav].map(([id,label,ic])=>({label,route:id,tab:null,icon:ic}));Object.entries(tabs).forEach(([n,arr])=>arr.forEach(([id,label])=>items.push({label,route:n,tab:id,icon:'search'})));window._searchItems=items;modal('بحث سريع','انتقل إلى الوظيفة المطلوبة مباشرة',`<label for="globalSearch">ابحث باسم القسم أو الوظيفة</label><input type="search" id="globalSearch" placeholder="مثل: الاستهداف، الحماية، العروض، الإسناد" autocomplete="off" /><div id="searchResults" class="search-list" style="margin-top:11px"></div>`);document.getElementById('globalSearch')?.focus();drawSearch('');}
function drawSearch(v){let root=document.getElementById('searchResults');if(!root)return;let r=window._searchItems.filter(x=>x.label.includes(v.trim())).slice(0,13);root.innerHTML=r.length?r.map(x=>`<button type="button" class="search-result" data-action="searchGo:${x.route}:${x.tab||''}">${icon(x.icon,'sm')}<span>${escapeHTML(x.label)}</span>${icon('chevron','sm')}</button>`).join(''):'<p class="muted small">لا توجد وظيفة مطابقة.</p>';}
function activityModal(){modal('اختر نشاطًا تجريبيًا','تبديل النشاط يحمّل سيناريو بيانات مختلفة ويعيد ضبط التدفقات التدريبية.',`<div class="grid" style="gap:9px">${Object.entries(scenarios).map(([id,d])=>`<button type="button" data-action="activity:${id}" class="feature" style="text-align:right;width:100%;cursor:pointer;border-color:${id===state.sector?'#9ec5b3':'var(--line)'}">${icon('building')}<div><h3>${escapeHTML(d.name)} ${id===state.sector?badge('الحالي','green'):''}</h3><p>${escapeHTML(d.type)} · ${escapeHTML(d.market)} · ${escapeHTML(d.offer)}</p></div></button>`).join('')}</div><div class="callout" style="margin-top:12px">${icon('info')}<div>يمكن تعديل نشاطك الحالي من الإعدادات. تغيير المثال يعيد بيانات السيناريو؛ لا يغير نشاطًا حقيقيًا.</div></div><div style="margin-top:12px">${btn(`${icon('plus')} أنشئ نشاطًا جديدًا دون حسابات متصلة`,'newBusiness','primary')}</div>`);}
function newBusiness(){modal('إعداد نشاط جديد','ابدأ من نشاطك وسوقك، دون اشتراط ربط منصة إعلانية',`<form id="newBusinessForm" class="formgrid"><div class="field"><label>اسم النشاط</label><input name="name" required maxlength="65" placeholder="اسم شركتك أو متجرك" /></div><div class="field"><label>القطاع</label><select name="sector"><option value="commerce">تجارة إلكترونية</option><option value="realestate">عقارات</option><option value="service">خدمات</option></select></div><div class="field full"><label>ماذا تقدم؟</label><input name="offer" required maxlength="110" placeholder="المنتجات أو الخدمات الأساسية" /></div><div class="field full"><label>السوق المستهدف</label><input name="market" required maxlength="100" placeholder="مثال: الرياض، السعودية" /></div><div class="field full"><label>غاية تجارية، إن وجدت</label><input name="goal" maxlength="180" placeholder="اختياري: زيادة الطلبات المكتملة" /></div><div class="field full"><button class="btn primary" type="submit">حفظ النشاط وفتح لوحة المعلن</button></div></form><div class="stepnote" style="margin-top:12px">هذه تجربة إعداد محلية: سيبدأ نشاطك بلا مصادر متصلة، ولن نملأ النتائج بأرقام مفترضة.</div>`);}
function newInquiry(){modal('تسجيل استفسار تدريبي','لا تُدخل أسماء أشخاص حقيقيين أو معلومات حساسة',`<form id="newInquiryForm" class="formgrid"><div class="field full"><label>وصف قصير</label><input name="name" required maxlength="70" placeholder="استفسار عن منتج / موعد / وحدة" /></div><div class="field"><label>قناة الوصول</label><select name="channel"><option>واتساب</option><option>مكالمة</option><option>نموذج</option><option>زيارة مباشرة</option></select></div><div class="field"><label>الحالة</label><select name="state"><option value="new">جديد</option><option value="qualified">مؤهل بحسب الإفادة</option><option value="closed">مغلق</option></select></div><div class="field full"><label>ملاحظة متابعة</label><textarea name="note" maxlength="350" placeholder="ما الذي ينبغي مراجعته لاحقًا؟"></textarea></div><div class="field full"><button type="submit" class="btn primary">حفظ الاستفسار محليًا</button></div></form>`);}
function editInquiry(id){const l=state.inquiries.find(x=>x.id===id);if(!l)return;modal('تحديث استفسار',l.id+' · سجل محلي غير متحقق',`<form id="leadEditForm" data-lead="${escapeHTML(id)}" class="formgrid"><div class="field full"><label>الوصف</label><input name="name" required maxlength="70" value="${escapeHTML(l.name)}" /></div><div class="field"><label>القناة</label><input value="${escapeHTML(l.channel)}" disabled /></div><div class="field"><label>الحالة</label><select name="state">${[['new','جديد'],['qualified','مؤهل بحسب الإفادة'],['closed','مغلق']].map(x=>`<option value="${x[0]}" ${l.state===x[0]?'selected':''}>${x[1]}</option>`).join('')}</select></div><div class="field full"><label>ملاحظة</label><textarea name="note" maxlength="350">${escapeHTML(l.note)}</textarea></div><div class="field full"><button class="btn primary" type="submit">حفظ المتابعة</button></div></form>`);}
function leadState(s){return({new:'جديد',qualified:'مؤهل بالإفادة',closed:'مغلق'})[s]||s;}
function newDecision(){modal('قرار جديد','سجل ما تحتاج مراجعته دون ادعاء تنفيذه',`<form id="newDecisionForm" class="formgrid"><div class="field full"><label>عنوان القرار</label><input name="title" maxlength="150" required placeholder="مثل: مراجعة جودة الاستفسارات"/></div><div class="field full"><label>سبب القرار أو دليل مطلوب</label><textarea name="note" required maxlength="500" placeholder="ما الذي عرفته أو ما الذي تحتاج إلى التحقق منه؟"></textarea></div><div class="field full"><button type="submit" class="btn primary">أضف قرارًا للمراجعة</button></div></form>`);}
function infoModal(kind){const text={codeScope:['العلاقة بالكود الحالي','فرع main راجعنا فيه Vue SPA ومسارات النشاط والأهداف وموصلات Meta وGoogle وTikTok وSnapchat وX، بالإضافة إلى حدود الصلاحيات وسجل بيانات الاستفسارات. هذا الملف نموذج UX مستقل ولا يستدعي تلك الواجهات أو يغيّر المستودع.'],sourceExplain:['صلاحية البيانات','تتطلب النتائج مصدرًا معروفًا وتاريخًا وصلاحية وحق استعمال. الإسناد لا يثبت نتيجة تجارية وحده.'],budgetExplain:['التوزيع قبل التنفيذ','الميزانية قرار تجاري مشروط بهامش الربح والطلب والسعة والنتائج المؤهلة. اختر الإعلانات ← الميزانيات لتجربة تسجيل قرار بدون تنفيذه.']};let m=text[kind]||['شرح','معلومات توضيحية'];modal(m[0],'حدود النموذج',[`<p style="margin:0 0 15px">${m[1]}</p>`,`<div class="callout">${icon('info')}<div>لا يوجد تكامل خارجي في هذا الملف، وجميع التغييرات تظل داخل المتصفح.</div></div>`].join(''),btn('حسنًا','closeModal','primary'));}
function providerModal(id){modal('الربط بالمصادر','المدخل الصحيح من التطبيق الفعلي وليس من ملف HTML',`<div class="row-list"><div class="row-item">${icon('shield')}<div class="grow"><strong>اتصال بإذن من صاحب الحساب</strong><p>استخدام مسار اعتماد مصمم للمزود ونطاق العمل المناسب.</p></div></div><div class="row-item">${icon('lock')}<div class="grow"><strong>حق القراءة منفصل عن حق التنفيذ</strong><p>لا يجب استنتاج صلاحية إدارة الحملات من صلاحية قراءة التقرير.</p></div></div><div class="row-item">${icon('clock')}<div class="grow"><strong>جاهزية محدثة</strong><p>التحقق من صلاحية الرموز والتغطية ومواعيد البيانات وأهلية الاستعمال.</p></div></div></div><div class="callout warning" style="margin-top:12px">${icon('alert')}<div>لم تتم محاولة ربط ${escapeHTML(id)}. الأزرار في هذا النموذج تشرح التجربة فقط.</div></div>`,btn('إغلاق','closeModal'));}
function exportSummary(){let obj={disclaimer:'DATA ARE LOCAL SYNTHETIC UI PROTOTYPE RECORDS; NOT VERIFIED OR EXECUTED',activity:{name:business().name,sector:data().type,offer:business().offer,market:business().market,goal:business().goal},mode:state.mode,decisions:state.decisions,inquiries:state.inquiries,manualUserAssertions:state.manual,audit:state.audit};const b=new Blob([JSON.stringify(obj,null,2)],{type:'application/json;charset=utf-8'});const url=URL.createObjectURL(b),a=document.createElement('a');a.href=url;a.download='builderad-prototype-local-records.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),500);toast('تم تصدير سجل التجربة إلى JSON محلي.');}
function handleAction(code){if(code==='closeModal')return closeModal();if(code==='toggleMenu'){state.sidebarOpen=!state.sidebarOpen;return render();}if(code==='search')return searchModal();if(code==='activitySwitch')return activityModal();if(code==='newBusiness')return newBusiness();if(code.startsWith('activity:')){let id=code.split(':')[1];if(!scenarios[id])return;let oldPage=state.page;state=fresh();state.sector=id;state.business={...scenarios[id]};state.page=oldPage;track('تبديل سيناريو النشاط إلى '+scenarios[id].name);closeModal();render();toast('تم تحميل سيناريو نشاط جديد؛ كل القيم تدريبية.');return;}if(code==='modeSample'||code==='modeEmpty'||code==='toggleMode'){state.mode=code==='modeSample'?'sample':code==='modeEmpty'?'empty':hasSample()?'empty':'sample';render();toast(state.mode==='empty'?'وضع بلا مصادر: اختفت الأرقام التدريبية.':'تم إظهار البيانات التدريبية الافتراضية.');return;}if(code==='editGoal')return navigate('plan','goals');if(code==='goMarket')return navigate('market','demand');if(code==='goPlan')return navigate('plan','channels');if(code==='goMessage')return navigate('plan','message');if(code==='goDecisions')return navigate('decisions','records');if(code==='goSources')return navigate('sources');if(code==='goSignals')return navigate('results','signals');if(code==='goInquiries')return navigate('sales','inquiries');if(code==='caseEvidence')return evidence();if(code==='fraudEvidence')return evidence('fraud');if(['codeScope','sourceExplain','budgetExplain'].includes(code))return infoModal(code);if(code==='marketOpportunity')return navigate('market','demand');if(code==='caseDecision'){addDecision('مراجعة سبب تغير التحويل التجاري','الرئيسية',data().reason);closeModal();navigate('decisions','records');return;}if(code==='fraudDecision'){addDecision('التحقق من جودة الزيارات قبل تقدير أي خسارة','الإعلانات','لا توجد خسارة مؤكدة؛ يلزم استبعاد النقرات المفوترة والمعالجة.');closeModal();navigate('decisions','records');return;}if(code==='planDecision'){addDecision('اختبار ملاءمة العرض وقنوات الوصول','العرض وخطة الوصول','تتطلب مقارنة مناسبة وخطة اختبار.');navigate('decisions','records');return;}if(code==='signalDecision'){addDecision('مراجعة مصادر التحويل والتكرار','النتائج والعائد','الإسناد يختلف عن النتيجة التجارية.');navigate('decisions','records');return;}if(code==='experimentDecision'){addDecision('تصميم تجربة تجارية صغيرة','القرارات والمتابعة','يجب تحديد فرضية ومعيار نجاح ومدة وبيانات مؤهلة.','تجربة');navigate('decisions','records');return;}if(code.startsWith('opp')){let i=Number(code.slice(3)),x=data().opps[i];if(!x)return;modal('تقييم فرصة افتراضية',x[0],`<div class="row-list"><div class="row-item">${icon('compass')}<div class="grow"><strong>لماذا تستحق النظر؟</strong><p>${escapeHTML(x[1])}</p></div></div><div class="row-item">${icon('search')}<div class="grow"><strong>ما الدليل؟</strong><p>لا يوجد مصدر سوق حقيقي في هذا HTML؛ هذه فرضية نموذج تجربة.</p></div></div><div class="row-item">${icon('checks')}<div class="grow"><strong>كيف نختبرها؟</strong><p>تأهيل مصدر، ثم اختبار عرض أو قناة أو منطقة بمؤشر نجاح معروف.</p></div></div></div>`,`${btn('إغلاق','closeModal')}<button class="btn primary" data-action="oppDecision:${i}">أضف إلى قراراتي</button>`);return;}if(code.startsWith('oppDecision:')){let x=data().opps[Number(code.split(':')[1])];if(x){addDecision('فحص فرصة: '+x[0],'السوق والعملاء',x[1]);closeModal();navigate('decisions','records')}return;}if(code.startsWith('campaign')){let c=data().campaigns[Number(code.slice(8))];if(c)modal('الحملة التدريبية',c[0],`<p class="muted">${escapeHTML(c[1])} · إنفاق افتراضي ${money(c[2])}</p><div class="callout warning">${icon('alert')}<div>لا توجد قراءة من API ولا إمكانية لتعديل الحملة من هذا الملف.</div></div>`,`${btn('إغلاق','closeModal')}${btn('سجل مراجعة للحملة','campaignReview','primary')}`);return;}if(code==='campaignReview'){addDecision('مراجعة حملة قبل أي تغيير','الإعلانات','يلزم التحقق من البيانات والصلاحيات والنتيجة.');closeModal();navigate('decisions','records');return;}if(code==='newInquiry')return newInquiry();if(code.startsWith('lead:'))return editInquiry(code.split(':')[1]);if(code==='newDecision')return newDecision();if(code.startsWith('decision:'))return showDecision(code.split(':')[1]);if(code.startsWith('decisionAdvance:')){let id=code.split(':')[1],d=state.decisions.find(x=>x.id===id);if(!d)return;d.status=d.status==='proposed'?'approved':d.status==='approved'?'logged':d.status==='logged'?'review':d.status;track('تغيرت حالة قرار '+d.id+' إلى '+decisionStatus(d.status));closeModal();render();showDecision(id);toast('تم تحديث حالة القرار محليًا فقط.');return;}if(code.startsWith('period:')){state.period=code.split(':')[1];render();return;}if(code.startsWith('connectHelp:'))return providerModal(code.split(':')[1]);if(code.startsWith('searchGo:')){let [,page,tab]=code.split(':');return navigate(page,tab||undefined);}if(code==='copyMessage'){navigator.clipboard?.writeText(state.draftMessage).then(()=>toast('تم نسخ الرسالة.')).catch(()=>toast('النسخ غير متاح في هذا المتصفح.'));return;}if(code==='export')return exportSummary();if(code==='reset'){modal('إعادة ضبط النموذج','يمسح السجلات والتعديلات التدريبية من هذا المتصفح فقط',`<p class="muted">لن يتغير أي نظام فعلي. ستعود السيناريوهات والسجلات الافتراضية إلى حالتها الأولى.</p>`,`${btn('إلغاء','closeModal')}<button class="btn danger" data-action="confirmReset">أعد ضبط التجربة</button>`);return;}if(code==='confirmReset'){state=fresh();save();closeModal();render();toast('أُعيد ضبط النموذج محليًا.');return;}}
function safeSubmit(form){let fd=new FormData(form),id=form.id;if(id==='newBusinessForm'){let sector=String(fd.get('sector'));if(!scenarios[sector])return;let next=fresh();next.sector=sector;next.business={...scenarios[sector],name:String(fd.get('name')).trim(),offer:String(fd.get('offer')).trim(),market:String(fd.get('market')).trim(),goal:String(fd.get('goal')).trim()||'لم تحدد غاية بعد'};next.mode='empty';next.page='home';next.decisions=[];next.inquiries=[];state=next;track('إنشاء نشاط محلي جديد دون مصادر');closeModal();render();toast('تم إنشاء النشاط داخل المتصفح. يمكنك استكشاف السوق والعرض ثم إضافة المصادر لاحقًا.');return;}if(id==='businessForm'){let newSector=fd.get('sector');if(!scenarios[newSector])return;if(newSector!==state.sector){const old=state.page;state=fresh();state.sector=newSector;state.page=old;state.business={...scenarios[newSector]};}state.business.name=String(fd.get('name')).trim();state.business.offer=String(fd.get('offer')).trim();state.business.market=String(fd.get('market')).trim();state.business.goal=String(fd.get('goal')).trim();track('تعديل تصريح معلومات النشاط');render();toast('حُفظت معلومات النشاط في هذا المتصفح فقط.');return;}
if(id==='offerForm'){state.business.offer=String(fd.get('offer')).trim();state.draftMessage=String(fd.get('message')).trim();track('تعديل العرض التجاري المعلن');render();toast('حُفظ العرض والمسودة محليًا.');return;}
if(id==='messageForm'){state.draftMessage=String(fd.get('message')).trim();track('حفظ مسودة رسالة تجارية');render();toast('حُفظت المسودة محليًا.');return;}
if(id==='goalForm'){state.business.goal=String(fd.get('goal')).trim();track('تعديل الغاية المعلنة دون تغيير الأدلة التاريخية');render();toast('حُدثت الغاية المعلنة محليًا.');return;}
if(id==='channelsForm'){state.channels=fd.getAll('channel').map(String);const val=document.getElementById('budgetSlider');state.budget=Number(val?.value||5000);addDecision('مراجعة خطة الوصول وقنواتها','العرض وخطة الوصول',`قنوات مرشحة: ${state.channels.join('، ')||'لم تُختر'}؛ حد افتراضي ${state.budget} ${data().currency}`);navigate('decisions','records');return;}
if(id==='budgetForm'){state.budget=Number(fd.get('budget'));addDecision('مراجعة توزيع ميزانية '+fmt(state.budget)+' '+data().currency,'الإعلانات','حد افتراضي لم يحرك أموالًا أو حملات.');navigate('decisions','records');return;}
if(id==='competitorForm'){let name=String(fd.get('competitor')).trim(),factor=String(fd.get('factor')),note=String(fd.get('observation')).trim();addDecision('مقارنة بديل: '+name,'السوق والعملاء',`${factor}: ${note}. هذه إفادة محلية غير موثقة.`);navigate('decisions','records');return;}
if(id==='manualForm'){let kind=String(fd.get('kind')),value=Number(fd.get('value'));state.manual.unshift({kind,value});track('إضافة إفادة نتيجة غير متحققة: '+kind);render();toast('أُضيف التصريح المحلي. لم يتحول إلى نتيجة موثقة.');return;}
if(id==='newInquiryForm'){state.inquiries.unshift({id:'L-'+String(Date.now()).slice(-5),name:String(fd.get('name')).trim(),channel:String(fd.get('channel')),state:String(fd.get('state')),note:String(fd.get('note')).trim()});track('تسجيل استفسار محلي');closeModal();navigate('sales','inquiries');toast('حُفظ الاستفسار داخل النموذج؛ لم يُرسل أي تواصل.');return;}
if(id==='leadEditForm'){let l=state.inquiries.find(x=>x.id===form.dataset.lead);if(!l)return;l.name=String(fd.get('name')).trim();l.state=String(fd.get('state'));l.note=String(fd.get('note')).trim();track('تحديث متابعة الاستفسار '+l.id);closeModal();navigate('sales','inquiries');toast('تم تحديث السجل المحلي.');return;}
if(id==='newDecisionForm'){addDecision(String(fd.get('title')).trim(),'قرار أنشأه المستخدم',String(fd.get('note')).trim());closeModal();navigate('decisions','records');return;}}
document.addEventListener('click',e=>{let navEl=e.target.closest('[data-nav]');if(navEl){e.preventDefault();navigate(navEl.dataset.nav);return;}let tabEl=e.target.closest('[data-tab]');if(tabEl){e.preventDefault();let [n,t]=tabEl.dataset.tab.split(':');state.tabs[n]=t;render();return;}let a=e.target.closest('[data-action]');if(a){e.preventDefault();handleAction(a.dataset.action);return;}if(e.target.matches('[data-backdrop]'))closeModal();});
document.addEventListener('submit',e=>{let f=e.target;if(!(f instanceof HTMLFormElement))return;e.preventDefault();if(!f.reportValidity())return;safeSubmit(f);});
document.addEventListener('input',e=>{if(e.target.id==='globalSearch')drawSearch(e.target.value);if(e.target.id==='budgetSlider'){let s=document.getElementById('budgetValue');if(s)s.textContent=fmt(Number(e.target.value));}});
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();searchModal();}if(e.key==='Escape'){if(document.querySelector('.modal-backdrop'))closeModal();else if(state.sidebarOpen){state.sidebarOpen=false;render();}}});
const hash=(location.hash||'').replace(/^#\/?/,'');if([...nav,...bottomNav].some(x=>x[0]===hash))state.page=hash;
render();
})();
</script>
</body></html>
